name: Required verification
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-full:
    name: full verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare browser prerequisites
        working-directory: app
        run: |
          npm ci --engine-strict
          npx --no-install playwright install --with-deps chromium
      # Mesmo runner local; cada família obrigatória precisa produzir evidência.
      - name: Full verification
        run: bash scripts/verify.sh --full
      - name: Installed execution security profile (systemd real)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .integration/i13-smoke/evidence
          mkdir -p .integration/previous
          curl -fLsS --retry 3 https://github.com/Dr0nj/regente/releases/download/v0.2.47/regente-server_linux_amd64.tar.gz -o .integration/previous/bundle.tar.gz
          bash scripts/smoke-install.sh --build --previous-bundle .integration/previous/bundle.tar.gz 2>&1 | tee .integration/i13-smoke/evidence/i13-systemd.log
      # Informativo; não compõe a condição de aprovação do perfil.
      - name: deadcode (informativo)
        continue-on-error: true
        working-directory: server
        run: go run golang.org/x/tools/cmd/deadcode@latest -test ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-evidence
          path: .integration/*/evidence/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-auth-failures
          path: app/test-results/

  capacity:
    name: measured capacity and developer soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
      - name: Incremental workload and 30-minute soak
        run: python3 scripts/capacity.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capacity-evidence
          path: .integration/*/evidence/
          include-hidden-files: true
          if-no-files-found: error
