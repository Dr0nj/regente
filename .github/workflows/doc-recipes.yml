name: Documentation recipes
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  node-minima:
    name: toolchain minimum Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.13.0', '24.0.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Clean install, declared engines and POSIX build
        working-directory: app
        run: |
          test ! -e .env && test ! -e .env.local && test ! -e .env.production
          unset VITE_REGENTE_SERVER_URL VITE_REGENTE_TOKEN
          npm ci --engine-strict
          node ../scripts/check-doc-recipes.cjs
          npm run lint
          VITE_REGENTE_SERVER_URL=@origin npm run build
  demo:
    name: PowerShell demo ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            server/go.sum
            agent/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux Docker agent, offline and explicit local Git origin
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./scripts/test-demo-guards.ps1
          ./deploy/demo/host-demo.ps1 -Smoke -Port 0 -EvidencePath "$env:RUNNER_TEMP/demo-offline.json"
          ./deploy/demo/host-demo.ps1 -Smoke -GitFixture -Port 0 -EvidencePath "$env:RUNNER_TEMP/demo-git.json"
      - name: Windows PowerShell launcher, synthetic native agent
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/test-demo-guards.ps1
          ./deploy/demo/host-demo.ps1 -Smoke -NativeSmoke -Port 0 -EvidencePath "$env:RUNNER_TEMP/demo-offline.json"
          ./deploy/demo/host-demo.ps1 -Smoke -NativeSmoke -GitFixture -Port 0 -EvidencePath "$env:RUNNER_TEMP/demo-git.json"
      - name: Windows SSH receipts and credential isolation
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REGENTE_REQUIRE_INTEGRATION: '1'
        run: |
          go -C agent test ./security -run '^TestCleanEnvironmentSystemPathsWithoutCredentials$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C server test ./internal/scheduler -run '^TestI10RealSSHReceiptsLossAndCancellation$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: demo-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/demo-offline.json
            ${{ runner.temp }}/demo-git.json
          if-no-files-found: warn
