name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # deadcode é INFORMATIVO (não falha o build): reporta funções inalcançáveis
      # a partir dos mains+testes. pkg/ é API pública (jobs-as-code/SDK) — aparece
      # como "morto" por não ter caller interno; ignorar essas linhas.
      - name: deadcode (informativo)
        run: go run golang.org/x/tools/cmd/deadcode@latest -test ./... || true
      - run: go test ./...
      # docs/site/ é build VERSIONADO (a doc abre sem subir server). Regenera e
      # falha se estiver defasado — senão o site do repo mente sobre o markdown.
      - name: docs site up to date
        run: |
          go run ./cmd/docsite -repo .. -out ../docs/site
          if ! git -C .. diff --quiet -- docs/site; then
            echo "::error::docs/site esta defasado. Rode: cd server && go run ./cmd/docsite -repo .. -out ../docs/site"
            git -C .. --no-pager diff --stat -- docs/site
            exit 1
          fi

  agent:
    name: agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go build ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test ./...

  app:
    name: app (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      # Gate ZERO: desde a catraca RH-4 as 4 regras react-hooks/react-refresh
      # são 'error' (não mais 'warn'), então lint sujo REPROVA o build.
      # Violação inevitável vai de eslint-disable ANOTADO com o motivo — nunca
      # rebaixando a regra. Ver app/eslint.config.js e o §RH do roadmap.
      - run: npm run lint
      - run: npm run build
