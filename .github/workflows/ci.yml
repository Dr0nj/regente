name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # deadcode é INFORMATIVO (não falha o build): reporta funções inalcançáveis
      # a partir dos mains+testes. pkg/ é API pública (jobs-as-code/SDK) — aparece
      # como "morto" por não ter caller interno; ignorar essas linhas.
      - name: deadcode (informativo)
        run: go run golang.org/x/tools/cmd/deadcode@latest -test ./... || true
      - run: go test ./...

  agent:
    name: agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test ./...

  app:
    name: app (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
