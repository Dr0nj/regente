name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read
jobs:
  doc-recipes:
    uses: ./.github/workflows/doc-recipes.yml
    with:
      ref: ${{ github.sha }}
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      ref: ${{ github.sha }}
