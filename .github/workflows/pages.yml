# Publica docs/site/ no GitHub Pages — a documentação e a referência de API são
# um LINK (https://dr0nj.github.io/regente/), sem ninguém precisar clonar o repo
# nem subir server. Ligado em 2026-07-27 (repo público + Source = GitHub Actions).
#
# Roda a cada push na main que toque doc, e sob demanda pela aba Actions.
name: Publish docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "*/README.md"
      - "*/*/README.md"
      - "server/internal/api/openapi.yaml"
      - "server/internal/api/apidocs.html"
      - "server/cmd/docsite/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Regenera em vez de confiar no commitado — o site publicado sempre reflete
      # o markdown deste commit.
      - name: Generate site
        run: cd server && go run ./cmd/docsite -repo .. -out ../docs/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@v4
