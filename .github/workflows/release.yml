name: Release

# TRÊS gatilhos:
#   • push na main  → release AUTOMÁTICA (patch seguinte). O que está na main mas
#     não está numa release não existe pra quem instala: o README manda baixar de
#     releases/latest. Pra pular uma entrega, escreva [no release] na mensagem do
#     commit (docs/roadmap sozinhos, por exemplo).
#   • tag vX.Y.Z    → release daquela versão (é assim que se sobe minor/major).
#   • workflow_dispatch → publica tag no mesmo SHA; versão existente é recusada.
#
# Publicar sempre só é seguro por causa do job `smoke`: ele INSTALA o artefato num
# Linux com systemd de verdade antes de publicar. Sem esse portão, "release a cada
# push" espalharia regressão na velocidade do push — foi o que aconteceu com a
# v0.2.0 (passou em build/vet/test/lint e travava a instalação mesmo assim).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Unpublished version tag at this source SHA, e.g. v0.2.48"
        required: true
        type: string

permissions:
  contents: read

# Uma release por vez: dois pushes seguidos calculariam o MESMO patch seguinte e
# uma sobrescreveria a outra. cancel-in-progress=false porque a que já começou
# tem de terminar (ela é a que vai virar `latest`).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  doc-recipes:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/doc-recipes.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  verification:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/verification.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  # Decide a versão ANTES de qualquer build: tag do ref, input do dispatch, ou
  # o próximo patch a partir da maior tag existente (push na main).
  version:
    name: definir versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0 # precisa do histórico de tags pra calcular o patch
      - id: pick
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Dispatch must use the tag source SHA; use a tag push for historical refs."; exit 1; }
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ]; then
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
            echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # push na main: opt-out explícito, e SÓ no ASSUNTO (primeira linha).
          # Procurar na mensagem inteira se mostrou ruim na prática — o commit que
          # criou esta regra explicava `[no release]` no corpo e o próprio workflow
          # obedeceu, pulando a release que devia publicar.
          subject="$(git log -1 --pretty=%s)"
          case "$subject" in
            *"[no release]"*|*"[skip release]"*)
              echo "assunto do commit pediu pra não publicar"; echo "skip=true" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          last="$(git tag -l 'v*.*.*' | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -1)"
          last="${last:-v0.0.0}"
          IFS=. read -r maj min pat <<< "${last#v}"
          echo "tag=v${maj}.${min}.$((pat + 1))" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
  # V1/V2 — a UI é buildada UMA vez (single-origin: @origin -> window.location.origin
  # em runtime) e reusada nos bundles Linux de todas as arquiteturas.
  spa:
    name: build SPA (single-origin)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Build SPA (@origin)
        working-directory: app
        env:
          VITE_REGENTE_SERVER_URL: "@origin"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-dist
          path: app/dist

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, spa]
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false: um alvo quebrado não deve cancelar os outros — mas o
      # publish só roda se TODOS passarem (needs: build), então uma release
      # nunca sai pela metade.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", bundle: true }
          - { goos: linux, goarch: arm64, ext: "", bundle: true }
          - { goos: windows, goarch: amd64, ext: ".exe", bundle: false }
          - { goos: darwin, goarch: amd64, ext: "", bundle: false }
          - { goos: darwin, goarch: arm64, ext: "", bundle: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      # Binários pure-Go (modernc sqlite + pgx) → CGO desligado, cross-compile limpo.
      - name: Build server
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # -X main.version: é isto que faz o rodapé da UI, o log de boot e o
        # `regente-server -version` dizerem a versão REAL do que está rodando.
        # Sem a injeção o binário publicado se apresentaria como "dev".
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ needs.version.outputs.tag }}" -o ../dist/regente-server_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Build agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.agentVersion=${{ needs.version.outputs.tag }}" -o ../dist/regente-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} .

      # V1+V2 — bundle Linux "caixa única": binário + UI + arquivos de deploy, num
      # layout que ESPELHA o repo, pra o install-linux.sh achar tudo por caminho
      # relativo (../regente-server, ../app/dist, ./deploy/*).
      - name: Download SPA
        if: matrix.bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-dist
          path: app/dist

      - name: Assemble server bundle
        if: matrix.bundle
        run: |
          B="regente-server_linux_${{ matrix.goarch }}"
          mkdir -p "stage/$B/deploy" "stage/$B/app"
          cp "dist/regente-server_linux_${{ matrix.goarch }}" "stage/$B/regente-server"
          chmod +x "stage/$B/regente-server"
          cp -r app/dist "stage/$B/app/dist"
          cp server/deploy/install-linux.sh server/deploy/configure.sh server/deploy/update.sh server/deploy/regente-server.service server/deploy/server.env.example server/deploy/install-audit-collector.sh server/deploy/regente-audit-collector.service "stage/$B/deploy/"
          # Borda (nginx/TLS/sandbox): o install-linux.sh instala isto em
          # /var/lib/regente/deploy/vps. Sem estar no bundle, quem usa o one-liner
          # fica sem os arquivos que o próprio deploy/vps/README.md manda copiar.
          cp -r deploy/vps "stage/$B/deploy/vps"
          tar -C stage -czf "dist/$B.tar.gz" "$B"

      # Cada alvo entrega seus arquivos como artifact; quem publica é o job único
      # abaixo. Antes, os 5 jobs chamavam action-gh-release em paralelo contra a
      # MESMA release — daí saírem releases incompletas.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # PORTÃO: instala o artefato que está prestes a ser publicado num Linux com
  # systemd de verdade e exercita o circuito do operador (instalar · config
  # errada sem crash-loop · repo vazio · repo já usado · agente · job rodando ·
  # reboot). Falhou aqui, não publica — é o que torna "release a cada push"
  # seguro. Ver scripts/smoke-install.sh.
  smoke:
    name: smoke de instalação (systemd real)
    needs: [version, build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Baixar os artefatos linux/amd64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: dist
      - name: Instalar de verdade e validar
        run: |
          set -euo pipefail
          mkdir -p .integration/previous
          curl -fLsS --retry 3 https://github.com/Dr0nj/regente/releases/download/v0.2.47/regente-server_linux_amd64.tar.gz -o .integration/previous/bundle.tar.gz
          python3 scripts/test-release-live.py dist
          chmod +x dist/regente-agent_linux_amd64
          bash scripts/smoke-install.sh \
            --bundle dist/regente-server_linux_amd64.tar.gz \
            --agent  dist/regente-agent_linux_amd64 \
            --manifest dist/release-manifest.json \
            --attestation dist/release-manifest.sigstore.json \
            --previous-bundle .integration/previous/bundle.tar.gz

  sign:
    name: authenticated release inventory
    needs: [version, build, verification, doc-recipes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Stage trusted bootstrap and frontend dependency inventory
        run: |
          cp install.sh dist/install.sh
          cp agent/deploy/install-agent.sh agent/deploy/install-agent-windows.ps1 agent/deploy/install-secure-linux.sh dist/
          mkdir inventory
          cp app/package.json app/package-lock.json inventory/
          cp -r dist inventory/artifacts
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: inventory
          syft-version: v1.54.0
          format: spdx-json
          output-file: dist/release-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Inventory every byte at the tested SHA
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release-manifest.py --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: provenance
        with:
          subject-path: dist/release-manifest.json
          create-storage-record: false
      - name: Keep portable signature bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/release-manifest.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error

  native:
    name: native ${{ matrix.goos }}/${{ matrix.arch }}
    needs: [version, sign]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, arch: amd64, ext: "" }
          - { runner: ubuntu-24.04-arm, goos: linux, arch: arm64, ext: "" }
          - { runner: windows-latest, goos: windows, arch: amd64, ext: ".exe" }
          - { runner: macos-15-intel, goos: darwin, arch: amd64, ext: "" }
          - { runner: macos-latest, goos: darwin, arch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release
          path: dist
      - name: Verify actual Windows installer signature and reject tampering
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-release-windows.ps1
      - name: Run the exact release binary on its native platform
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          server="dist/regente-server_${TARGET_OS}_${TARGET_ARCH}${TARGET_EXT}"
          agent="dist/regente-agent_${TARGET_OS}_${TARGET_ARCH}${TARGET_EXT}"
          chmod +x "$server" "$agent"
          test "$("$server" -version)" = "$RELEASE_VERSION"
          test "$("$agent" -version)" = "$RELEASE_VERSION"
          "$server" -db "$RUNNER_TEMP/native.db" -db-driver sqlite -migrate-only
          "$server" -db "$RUNNER_TEMP/native.db" -db-driver sqlite -migrate-only
          echo "I15 native version and repeatable schema initialization passed"

  publish:
    name: publish release
    permissions:
      contents: write
    needs: [version, build, smoke, verification, doc-recipes, sign, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Download every build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: dist

      # Scripts de instalação soltos na release: são o que o README manda baixar
      # de .../releases/latest/download/ — sem eles o caminho "fácil" dá 404.
      - name: Stage install scripts
        run: |
          cp install.sh dist/install.sh
          cp agent/deploy/install-agent.sh agent/deploy/install-agent-windows.ps1 agent/deploy/install-secure-linux.sh dist/

      # Guarda-chuva contra release incompleta: falha ANTES de publicar se faltar
      # qualquer arquivo que a documentação promete.
      - name: Verify the release payload
        run: |
          set -euo pipefail
          required="
            release-manifest.json
            release-manifest.sigstore.json
            release-sbom.spdx.json
            install.sh
            install-secure-linux.sh
            install-agent.sh
            install-agent-windows.ps1
            regente-server_linux_amd64.tar.gz
            regente-server_linux_arm64.tar.gz
            regente-server_linux_amd64
            regente-server_linux_arm64
            regente-server_windows_amd64.exe
            regente-server_darwin_amd64
            regente-server_darwin_arm64
            regente-agent_linux_amd64
            regente-agent_linux_arm64
            regente-agent_windows_amd64.exe
            regente-agent_darwin_amd64
            regente-agent_darwin_arm64
          "
          missing=0
          for f in $required; do
            if [ ! -s "dist/$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "release payload incomplete — refusing to publish"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Verify signed manifest and all payload bytes
        run: python3 scripts/test-release-live.py dist

      - name: Refuse an already published version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          status=$(curl -sS -o /tmp/release.json -w "%{http_code}" "https://api.github.com/repos/Dr0nj/regente/releases/tags/$RELEASE_TAG")
          test "$status" = 404 || { echo "Release exists or lookup failed; published assets cannot be replaced."; exit 1; }
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          files: dist/*
          fail_on_unmatched_files: true
