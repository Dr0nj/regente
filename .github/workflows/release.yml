name: Release

# TRÊS gatilhos:
#   • push na main  → release AUTOMÁTICA (patch seguinte). O que está na main mas
#     não está numa release não existe pra quem instala: o README manda baixar de
#     releases/latest. Pra pular uma entrega, escreva [no release] na mensagem do
#     commit (docs/roadmap sozinhos, por exemplo).
#   • tag vX.Y.Z    → release daquela versão (é assim que se sobe minor/major).
#   • workflow_dispatch → REPUBLICA os assets de uma tag existente sem criar
#     versão nova (foi assim que a v0.1.0 ficou com só 2 dos 5 alvos anexados).
#
# Publicar sempre só é seguro por causa do job `smoke`: ele INSTALA o artefato num
# Linux com systemd de verdade antes de publicar. Sem esse portão, "release a cada
# push" espalharia regressão na velocidade do push — foi o que aconteceu com a
# v0.2.0 (passou em build/vet/test/lint e travava a instalação mesmo assim).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a (re)publicar, ex.: v0.2.0"
        required: true
        type: string

permissions:
  contents: write # necessário para criar o GitHub Release e anexar binários

# Uma release por vez: dois pushes seguidos calculariam o MESMO patch seguinte e
# uma sobrescreveria a outra. cancel-in-progress=false porque a que já começou
# tem de terminar (ela é a que vai virar `latest`).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide a versão ANTES de qualquer build: tag do ref, input do dispatch, ou
  # o próximo patch a partir da maior tag existente (push na main).
  version:
    name: definir versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico de tags pra calcular o patch
      - id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # push na main: opt-out explícito, e SÓ no ASSUNTO (primeira linha).
          # Procurar na mensagem inteira se mostrou ruim na prática — o commit que
          # criou esta regra explicava `[no release]` no corpo e o próprio workflow
          # obedeceu, pulando a release que devia publicar.
          subject="$(git log -1 --pretty=%s)"
          case "$subject" in
            *"[no release]"*|*"[skip release]"*)
              echo "assunto do commit pediu pra não publicar"; echo "skip=true" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          last="$(git tag -l 'v*.*.*' | sort -V | tail -1)"
          last="${last:-v0.0.0}"
          IFS=. read -r maj min pat <<< "${last#v}"
          echo "tag=v${maj}.${min}.$((pat + 1))" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
  # V1/V2 — a UI é buildada UMA vez (single-origin: @origin -> window.location.origin
  # em runtime) e reusada nos bundles Linux de todas as arquiteturas.
  spa:
    name: build SPA (single-origin)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build SPA (@origin)
        working-directory: app
        env:
          VITE_REGENTE_SERVER_URL: "@origin"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, spa]
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false: um alvo quebrado não deve cancelar os outros — mas o
      # publish só roda se TODOS passarem (needs: build), então uma release
      # nunca sai pela metade.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", bundle: true }
          - { goos: linux, goarch: arm64, ext: "", bundle: true }
          - { goos: windows, goarch: amd64, ext: ".exe", bundle: false }
          - { goos: darwin, goarch: amd64, ext: "", bundle: false }
          - { goos: darwin, goarch: arm64, ext: "", bundle: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Binários pure-Go (modernc sqlite + pgx) → CGO desligado, cross-compile limpo.
      - name: Build server
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../dist/regente-server_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Build agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../dist/regente-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} .

      # V1+V2 — bundle Linux "caixa única": binário + UI + arquivos de deploy, num
      # layout que ESPELHA o repo, pra o install-linux.sh achar tudo por caminho
      # relativo (../regente-server, ../app/dist, ./deploy/*).
      - name: Download SPA
        if: matrix.bundle
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app/dist

      - name: Assemble server bundle
        if: matrix.bundle
        run: |
          B="regente-server_linux_${{ matrix.goarch }}"
          mkdir -p "stage/$B/deploy" "stage/$B/app"
          cp "dist/regente-server_linux_${{ matrix.goarch }}" "stage/$B/regente-server"
          chmod +x "stage/$B/regente-server"
          cp -r app/dist "stage/$B/app/dist"
          cp server/deploy/install-linux.sh server/deploy/configure.sh server/deploy/regente-server.service server/deploy/server.env.example "stage/$B/deploy/"
          tar -C stage -czf "dist/$B.tar.gz" "$B"

      # Cada alvo entrega seus arquivos como artifact; quem publica é o job único
      # abaixo. Antes, os 5 jobs chamavam action-gh-release em paralelo contra a
      # MESMA release — daí saírem releases incompletas.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # PORTÃO: instala o artefato que está prestes a ser publicado num Linux com
  # systemd de verdade e exercita o circuito do operador (instalar · config
  # errada sem crash-loop · repo vazio · repo já usado · agente · job rodando ·
  # reboot). Falhou aqui, não publica — é o que torna "release a cada push"
  # seguro. Ver scripts/smoke-install.sh.
  smoke:
    name: smoke de instalação (systemd real)
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Baixar os artefatos linux/amd64
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist
      - name: Instalar de verdade e validar
        run: |
          chmod +x dist/regente-agent_linux_amd64
          bash scripts/smoke-install.sh \
            --bundle dist/regente-server_linux_amd64.tar.gz \
            --agent  dist/regente-agent_linux_amd64

  publish:
    name: publish release
    needs: [version, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Scripts de instalação soltos na release: são o que o README manda baixar
      # de .../releases/latest/download/ — sem eles o caminho "fácil" dá 404.
      - name: Stage install scripts
        run: |
          cp install.sh dist/install.sh
          cp agent/deploy/install-agent.sh agent/deploy/install-agent-windows.ps1 dist/

      # Guarda-chuva contra release incompleta: falha ANTES de publicar se faltar
      # qualquer arquivo que a documentação promete.
      - name: Verify the release payload
        run: |
          set -euo pipefail
          required="
            install.sh
            install-agent.sh
            install-agent-windows.ps1
            regente-server_linux_amd64.tar.gz
            regente-server_linux_arm64.tar.gz
            regente-server_linux_amd64
            regente-server_linux_arm64
            regente-server_windows_amd64.exe
            regente-server_darwin_amd64
            regente-server_darwin_arm64
            regente-agent_linux_amd64
            regente-agent_linux_arm64
            regente-agent_windows_amd64.exe
            regente-agent_darwin_amd64
            regente-agent_darwin_arm64
          "
          missing=0
          for f in $required; do
            if [ ! -s "dist/$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "release payload incomplete — refusing to publish"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
