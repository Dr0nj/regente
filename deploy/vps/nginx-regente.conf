# deploy/vps/nginx-regente.conf — reverse proxy TLS p/ o regente-server (single-origin).
#
# Padrão "empresa grande": o TLS termina no nginx (borda), que faz proxy pro
# regente-server no loopback (127.0.0.1:8080). UI + API + WebSocket saem todos
# pelo MESMO domínio/origem. Agentes conectam por wss://<domínio>/ws/agent.
#
# Como usar:
#   1) troque REGENTE_DOMAIN pelo seu domínio (ex.: regente.suaempresa.com)
#   2) copie p/ /etc/nginx/conf.d/regente.conf
#   3) nginx -t && systemctl reload nginx
#   4) TLS:  sudo DOMAIN=... EMAIL=... ./enable-tls.sh   (certbot --nginx sobe o :443
#            e adiciona o redirect 80->443 preservando estas locations)

# WebSocket precisa repassar Upgrade/Connection; este map alimenta as locations /ws/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream regente_backend {
    server 127.0.0.1:8080;   # regente-server (loopback — nunca exponha a :8080 direto)
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name REGENTE_DOMAIN;

    client_max_body_size 50m;   # margem p/ payloads de API / import Control-M

    # Regente lê X-Forwarded-* p/ o IP real na auditoria (middleware RealIP).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hardening de borda (HSTS só vale sobre HTTPS — inócuo antes do certbot subir o :443).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # WebSocket: UI live (/ws/web) + agentes conectando pelo domínio (/ws/agent).
    location /ws/ {
        proxy_pass http://regente_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # conexões longas não expiram
        proxy_send_timeout 3600s;
    }

    # Transporte de agentes por SSE (/api/agent/events) e long-poll (/api/agent/poll):
    # exige buffering OFF e timeout longo, senão o push imediato/stream quebra.
    location /api/agent/ {
        proxy_pass http://regente_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Resto: UI (SPA) + API + /metrics + /api-docs — tudo numa origem só.
    location / {
        proxy_pass http://regente_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
