kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: regente-kubernetes-phase05
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30448
        hostPort: 13443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      regente.io/execution: "true"
