# API-1 — Contrato OpenAPI CURADO da superfície de integração do Regente.
#
# ESCRITO À MÃO de propósito (decisão registrada no roadmap): NÃO é auto-doc
# swaggo dos ~137 handlers — a maioria é superfície INTERNA da SPA (Design
# sessions, auth de UI, settings...), muda com a UI e não é contrato. Aqui
# entra só o que um sistema EXTERNO realmente chama (CI/CD, ticketing,
# pipeline de dados, cron serverless, monitoração) — a MESMA superfície do
# SDK Go (pkg/client, ADV-6) e do CLI `regente ops`.
#
# ESPELHO DECLARADO dos handlers Go: mudou rota/payload da superfície de
# integração → atualiza AQUI (o teste apidocs_test.go trava rota da spec que
# não existe mais no router). Servido em /api-docs (viewer) e
# /api-docs/openapi.{yaml,json} (o contrato cru).
#
# Texto voltado ao usuário: INGLÊS (o contrato é público).
openapi: 3.0.3
info:
  title: Regente — integration API
  version: "1.0"
  description: |
    **Curated** contract of Regente's integration surface: the routes an
    external system actually calls. The SPA's internal surface (Design
    sessions, users, settings, alerting...) is deliberately left out — it
    evolves with the UI and is not a contract.

    ### Authentication
    The security declaration below models the **integration bearer transport**.
    In `local` or `hybrid` mode, POST `/api/auth/login` with
    `{"username":"...","password":"..."}` (omit `browser`, or set it false)
    returns `{token,user}`. Send that token as `Authorization: Bearer <token>`.
    The deployment's static `REGENTE_TOKEN` is also accepted as admin in those
    modes. Neither ordinary password login nor the static token bypasses `oidc`
    mode. Explicitly configured emergency access is a separate, audited,
    15-minute recovery path, not a normal integration credential.

    **Browser sessions are different:** login with `browser:true` returns an
    empty JSON token and an HttpOnly, SameSite=Lax cookie (`regente_session` on
    HTTP, `__Host-regente_session` with Secure on HTTPS). OIDC also uses cookies.
    Cookie requests require an allowed origin and, except GET/HEAD/OPTIONS,
    `X-CSRF-Token` from login or GET `/api/auth/me` (including POST/QUERY reads).
    Never copy browser cookies into bearer headers, URLs or localStorage.
    Browser session values are rejected as API bearers; query-string session
    tokens are not accepted. The API explorer uses an API bearer, not SPA login.

    **Machine credentials** are separately issued agent tokens, scoped to agent
    ID/environment/capabilities and used only on agent transports. They are not
    human API sessions; the server admin bearer cannot authenticate an agent.

    **Public entry points** include `/health`, `/livez`, `/readyz`, `/metrics`,
    `/api/env`, `/api/auth/config`, `/api/auth/login`, OIDC login/callback and
    `/api-docs`. Login entry points still enforce their own policy. Signed quick
    actions use their scoped link token, not anonymous authorization. Web events
    use a 30-second, single-use ticket from authenticated POST
    `/api/auth/event-ticket`; a ticket is not a reusable API credential.

    Auth errors: `401` for missing/invalid credentials or a disallowed session
    source; `403` for invalid transport/CSRF or insufficient role/ACL. Error
    bodies are `text/plain` (raw message), not JSON. See the authentication,
    agent identity and web event guides for the full policies.

    ### RBAC
    Reads respect the user's folder ACLs (admin sees everything). Lifecycle
    actions require the `operator`/`admin` role **and** write access on the
    instance's folder. Archives and export are admin-only.

    ### The QUERY HTTP verb
    `POST /api/instances/query` also accepts the `QUERY` method (IETF httpbis
    draft — safe/idempotent with a body), same handler and same contract.
    OpenAPI 3.0 cannot model custom verbs, so the POST form is documented
    here; `QUERY` is progressive enhancement for clients that support it.

    ### Ingest idempotency
    `POST /api/events/ingest` is idempotent on the SENDER's key (`id` + PK in
    `external_events`): an at-least-once retry answers `duplicate:true`
    without reapplying any effect. Without an `id`, every POST applies (no
    key, no dedupe).
servers:
  - url: /
    description: Single-origin — the server serves the API, the SPA, the docs and this contract on the same port.
tags:
  - name: System
    description: Health/liveness/readiness and Prometheus metrics. Public (scraper/probe-friendly).
  - name: Query
    description: Typed composed query (D-5) and NL-query over the current day's state.
  - name: Lifecycle
    description: Operational actions on an instance (classic enterprise parity) + Force Order.
  - name: External events
    description: Idempotent ingestion (D-3) — another system unblocks jobs without polling.
  - name: Daily
    description: State and report/SLO of the daily (E5).
  - name: Forecast
    description: Simulation of what the daily would materialize (F21/CTM-6). Read-only, never touches the database.
  - name: Catalog
    description: JobTypes with a declared per-type schema (ADV-1).
  - name: Archives
    description: Dailies archived by the retention policy (ADV-5). Admin-only.
  - name: Quick actions
    description: Single-scope HMAC links coming from alerts (D-15). The signed token IS the auth.
  - name: Scheduler
    description: On-demand tick for the -scheduler=external mode (external cron).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      summary: Basic health check
      operationId: health
      security: []
      x-permission: public
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /livez:
    get:
      tags: [System]
      summary: Liveness (R2)
      description: |
        200 for as long as the process serves HTTP. Reports the age of the
        scheduler's last tick (informational — it does NOT fail on a stale
        tick: under `-scheduler=external` the tick comes from cron and failing
        would cause a restart loop).
      operationId: livez
      security: []
      x-permission: public
      responses:
        "200":
          description: Process alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive: { type: boolean }
                  schedulerLastTickAgeSeconds:
                    type: number
                    description: -1 if the scheduler has never ticked.
  /readyz:
    get:
      tags: [System]
      summary: Readiness (R3)
      description: |
        "Can this node serve correct answers?" The hard gate is a reachable DB
        (503 without one — point the k8s readinessProbe here). Leadership and
        tick/daily age are REPORTED but never fail the check: a follower serves
        the API normally.
      operationId: readyz
      security: []
      x-permission: public
      responses:
        "200":
          description: Node ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readyz" }
        "503":
          description: DB unreachable — take the node out of rotation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readyz" }
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics (P17)
      description: |
        Prometheus text format, no external dependency. Main gauges:
        `regente_up`, `regente_env_info{env}`, `regente_instances{status}`,
        `regente_agents_online`, `regente_sla_breaches_total`,
        `regente_git_drift`, `regente_scheduler_last_tick_age_seconds`,
        `regente_is_leader`, `regente_event_queue_depth`.
      operationId: metrics
      security: []
      x-permission: public
      responses:
        "200":
          description: Prometheus exposition.
          content:
            text/plain:
              schema: { type: string }
              example: |
                regente_up 1
                regente_instances{status="OK"} 1234
                regente_is_leader 1
  /api/instances/query:
    post:
      tags: [Query]
      summary: Typed composed query (D-5)
      description: |
        Composed filtering beyond the query string of `/api/instances`: date
        ranges, IN lists (folders/statuses), flags (forced/carried/late) and
        aggregation (`groupBy`). STRICT parsing — an unknown field is a 400
        (this is not SQL-over-HTTP; every filter is typed and parameterized).
        An empty body `{}` means today's daily, unfiltered. Keyset pagination
        via `cursor` = the id of the last item on the previous page (only
        without `groupBy`).

        Also accepts the `QUERY` HTTP method (same handler/contract).
      operationId: queryInstances
      x-permission: any logged-in user (reads filtered by folder ACLs)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StructuredQuery" }
            example: { statuses: [NOTOK], limit: 100 }
      responses:
        "200":
          description: Paginated list (without groupBy) OR aggregation (with groupBy).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/QueryResultList"
                  - $ref: "#/components/schemas/QueryResultGrouped"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/query:
    post:
      tags: [Query]
      summary: NL-query (text → structured query)
      description: |
        Interprets a natural-language question (en/pt) about the current day —
        "how many jobs failed today?", "why didn't etl-sales run?" — and runs
        the intent (summary/count/list/explain) against the database.
        Deterministic (an intent parser, no AI). The response returns the
        interpreted intent plus the structured answer.
      operationId: nlQuery
      x-permission: any logged-in user (reads filtered by folder ACLs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string, description: "The question, in natural language." }
            example: { q: "how many jobs failed today?" }
      responses:
        "200":
          description: Interpreted intent + answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interpreted:
                    type: object
                    description: How the question was understood (kind/status/folder/job).
                  answer:
                    type: object
                    description: Structured answer (its shape varies with the kind — text/count/byStatus/items...).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/instances/{id}:
    get:
      tags: [Query]
      summary: Detail of one instance (+ the order's frozen action)
      description: |
        The full runtime row plus what the list deliberately does NOT carry
        (scale payload): `label`, `jobType` and `actionConfig` extracted from
        the `definition_snapshot` — the photo of the definition frozen when the
        instance was ordered, the SAME one the dispatch executes. Editing the
        job in Design after the order does not change this response. A folder
        the user cannot read answers 404 (it does not leak existence).
      operationId: getInstance
      x-permission: any logged-in user (reads filtered by folder ACLs)
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Instance detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Instance not found (or folder not readable).
          content:
            text/plain:
              schema: { type: string }
    delete:
      tags: [Lifecycle]
      summary: Delete — removes the order (ONLY on HOLD)
      description: |
        The classic "Delete job": removes the instance from the screen and from
        the state store. Requires the job to be on HOLD — since RUNNING is not
        holdable, a job in execution is never deletable; any other status
        becomes deletable by going through Hold first. Deletion does not touch
        the condition pool: consumed conditions remain absent and unconsumed
        conditions remain available. There is no per-instance reservation.
      operationId: deleteInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example: { id: "etl-sales_2026-07-10_a1b2", status: deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Instance not found.
          content:
            text/plain:
              schema: { type: string }
        "409":
          description: Not on HOLD (hold it first; RUNNING is not deletable).
          content:
            text/plain:
              schema: { type: string }
  /api/instances/{id}/hold:
    post:
      tags: [Lifecycle]
      summary: Hold — holds an instance (any status except RUNNING)
      description: |
        General hold: any status → HELD, except RUNNING (409 — the execution is
        already on the agent; cancel it or wait) and HELD itself (an idempotent
        no-op that echoes the current state). The original status is frozen in
        `heldFromStatus` and Release restores THAT — holding an OK and
        releasing it re-executes nothing.
      operationId: holdInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Hold applied (or a no-op if it was already HELD).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example: { id: "etl-sales_2026-07-10_a1b2", status: HELD }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: RUNNING cannot be held.
          content:
            text/plain:
              schema: { type: string }
  /api/instances/{id}/release:
    post:
      tags: [Lifecycle]
      summary: Release — releases a HELD instance
      description: |
        HELD → the ORIGINAL status frozen by the hold (`heldFromStatus`; legacy
        holds without it fall back to WAITING). A released WAITING re-enters
        normal gating on the next tick; a released OK/NOTOK simply goes back to
        being OK/NOTOK. A job held by a FOLDER PAUSE answers 409 — only the
        folder resume releases it.
      operationId: releaseInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Release applied (or a no-op if it was not HELD).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example: { id: "etl-sales_2026-07-10_a1b2", status: WAITING }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Held by a folder pause (release it through the folder).
          content:
            text/plain:
              schema: { type: string }
  /api/instances/{id}/cancel:
    post:
      tags: [Lifecycle]
      summary: Cancel — cancels the instance
      description: |
        RUNNING: sends a best-effort cancel signal to the assigned agent and
        finalizes NOTOK (exitCode -1), without automatic retry. This evaluates
        failure alerts and On/Do result=NOTOK and exit=-1 rules; such rules can
        have their own side effects. A successful response is not proof that a
        remote process stopped (for example, the agent may be offline).

        WAITING or HELD: becomes CANCELLED; no execution is killed and this path
        does not evaluate failure alerts/On/Do. Terminal states are rejected
        with 409. Cancellation itself does not change the condition pool.
        The returned status describes the cancel action, not a kill acknowledgement
        or a guarantee against concurrent completion and configured On/Do actions.
      operationId: cancelInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Cancel action applied (NOTOK for RUNNING; CANCELLED for WAITING/HELD).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              examples:
                running:
                  value: { id: "etl-sales_2026-07-10_a1b2", status: NOTOK }
                pending:
                  value: { id: "etl-sales_2026-07-10_a1b2", status: CANCELLED }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Instance lookup failed (currently includes an unknown ID).
          content:
            text/plain:
              schema: { type: string }
        "409":
          description: Instance is not RUNNING, WAITING or HELD.
          content:
            text/plain:
              schema: { type: string }
  /api/instances/{id}/rerun:
    post:
      tags: [Lifecycle]
      summary: Rerun — resets to WAITING
      description: |
        Clears started/finished/exitCode/output and goes back to WAITING. The
        `confirmed` flag SURVIVES the rerun (BUG-2): an already-confirmed job
        does not fall back to the CONFIRM gate. Pending alerts for the job are
        marked as handled; the tick is nudged - with the gates satisfied, the
        job goes in right away.

        Rerun does NOT change the condition pool or reset descendants. A
        producer's previously published condition remains available until it
        is removed. A consumer whose OK/Set OK removed its input waits again
        if that condition is still absent. NOTOK/CANCELLED does not consume
        inputs; rerun can proceed only if they still exist and other gates pass.
        Hand-authored inputs without out-remove are not consumed on OK.
        The existing order keeps its frozen definition snapshot (M1).
        Run Now's one-shot bypass is cleared; Order Force keeps its order mode.
      operationId: rerunInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Reset to WAITING.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example: { id: "etl-sales_2026-07-10_a1b2", status: WAITING }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/instances/{id}/set-ok:
    post:
      tags: [Lifecycle]
      summary: Set OK — flips WAITING/NOTOK/CANCELLED → OK
      description: |
        The classic "Set OK": marks it OK and applies conditionsOutAdd and
        conditionsOutRemove from the frozen order snapshot to the condition pool.
        It also applies to WAITING (a job stuck on WAIT COND finishes OK right
        away, BUG-3). 400 if the instance is not in an eligible state (e.g.
        RUNNING).
      operationId: setOKInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Marked OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example: { id: "etl-sales_2026-07-10_a1b2", status: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/instances/{id}/confirm:
    post:
      tags: [Lifecycle]
      summary: Confirm — opens the WAIT_CONFIRM gate
      description: |
        The classic "Confirm": releases a job defined with `confirm: true`. It
        applies to WAITING and HELD (confirming while held counts; it runs once
        released). Not even Force bypasses this gate — only Confirm. It nudges
        the tick: confirmed, dispatched.
      operationId: confirmInstance
      x-permission: operator/admin + write access on the instance's folder
      parameters: [{ $ref: "#/components/parameters/instanceId" }]
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ActionResult"
                  - type: object
                    properties:
                      confirmed: { type: boolean }
              example: { id: "closing_2026-07-10_c3d4", status: WAITING, confirmed: true }
        "400":
          description: Instance not found, or not on WAITING/HELD.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/definitions/{id}/force:
    post:
      tags: [Lifecycle]
      summary: Force Order — materializes the published def into today's daily
      description: |
        The classic "Order Force": creates an instance from the most current
        PUBLISHED definition, right now, in today's daily (the regular daily is
        an immutable photo; force picks up the live def — only for the forced
        job).
      operationId: forceOrder
      x-permission: operator/admin + write access on the definition's folder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The definition ID (the YAML id in the workspace).
      responses:
        "200":
          description: Instance created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId: { type: string }
              example: { instanceId: "etl-sales_2026-07-10_f0rc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Definition not found.
          content:
            text/plain:
              schema: { type: string }
  /api/events/ingest:
    post:
      tags: [External events]
      summary: Idempotent ingestion of an external event (D-3)
      description: |
        Another system (CDC, pipeline, vendor webhook) reports that something
        happened — and that unblocks jobs WITHOUT polling: it sets conditions
        (scoped by `date`, defaulting to today in the business timezone) and/or
        forces a job.

        **Idempotent** on the sender's key: `id` is the PK — an at-least-once
        retry answers `duplicate: true` without reapplying. **Persisted**: the
        event and what it caused (`applied`) stay in the table (forensics for
        "who unblocked this job at 03:14"). **Immediate**: it nudges the tick.

        Requires `conditions[]` (or `condition`) and/or `forceJob` — nothing to
        apply is a 400.
      operationId: ingestEvent
      x-permission: operator/admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestEvent" }
            example:
              id: order-batch-2026-07-10
              source: sap
              kind: file-arrived
              conditions: [SALES_FILE_OK]
              forceJob: etl-sales
      responses:
        "200":
          description: |
            Event accepted. `duplicate: false` + `applied` (the list of what was
            done, item by item, with partial ERRORs inline) — or
            `duplicate: true` + `applied: false` on a retry (nothing reapplied).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
              example:
                id: order-batch-2026-07-10
                duplicate: false
                applied: ["condition SALES_FILE_OK@2026-07-10", "force etl-sales → etl-sales_2026-07-10_a1b2"]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events/external:
    get:
      tags: [External events]
      summary: Latest ingested events (forensics/debug)
      operationId: listExternalEvents
      x-permission: any logged-in user
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/daily/run:
    post:
      tags: [Daily]
      summary: Plan or resume the current business daily
      operationId: runDaily
      x-permission: admin or operator
      responses:
        "200": { description: Completed or already completed; returns orderDate, created and run. }
        "409": { description: Incomplete materialization or invalid configuration; includes error and committed checkpoint when available. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/daily/resume:
    post:
      tags: [Daily]
      summary: Resume an existing frozen daily plan
      operationId: resumeDaily
      x-permission: admin or operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderDate]
              properties:
                orderDate: { type: string, format: date }
      responses:
        "200": { description: Resumed or already completed; returns orderDate, created and run. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No persisted daily for this date. }
        "409": { description: Legacy daily without a frozen plan or failed recovery. }
  /api/daily/status:
    get:
      tags: [Daily]
      summary: Daily state (business clock)
      description: |
        Last materialization + the configured time (`settings.daily_at`) + the
        business timezone (E1). `orderDate`/`serverNow` are in the business
        timezone — that is the clock that decides what "today" means.
      operationId: dailyStatus
      x-permission: any logged-in user
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/daily/report:
    get:
      tags: [Daily]
      summary: Daily report/SLO (E5)
      description: |
        The summary operations asks for at the end of the day: counts per
        state, punctuality of the materialization (`lateStart`, 5-minute
        tolerance), whether the day "closed" (`closed` — nothing
        WAITING/RUNNING), failures (capped at 100, the count is always exact)
        and SLA breaches. It is also the payload of the optional push
        (`daily_report_channels`).
      operationId: dailyReport
      x-permission: any logged-in user
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: YYYY-MM-DD; defaults to today's daily in the business timezone.
      responses:
        "200":
          description: Aggregated report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/forecast:
    get:
      tags: [Forecast]
      summary: Forecast for one day (F21)
      description: |
        Simulates in RAM what the daily would materialize on `date`: who is
        eligible (the SAME gating as RunDaily — frequency, include/exclude
        calendars, shift, via IsScheduledOn), topological order (waves), blocks
        from deps/resources/conditions and projected SLA violations. It never
        touches the database.
      operationId: getForecast
      x-permission: any logged-in user
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: YYYY-MM-DD; defaults to today.
      responses:
        "200":
          description: Simulation of the day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/forecast/range:
    get:
      tags: [Forecast]
      summary: Forecast for N days ahead (CTM-6)
      description: One ForecastReport per day, same gating as RunDaily. The classic "≥1 week".
      operationId: getForecastRange
      x-permission: any logged-in user
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: YYYY-MM-DD; defaults to today.
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 366 }
      responses:
        "200":
          description: One report per day.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForecastReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/jobtypes:
    get:
      tags: [Catalog]
      summary: JobType catalog (ADV-1)
      description: |
        The DEDICATED schema of every jobType (fields, required ones, kinds,
        enums, aliases), straight from the registry the validator uses — the
        same source as the DRAFT-on-save / STRICT-on-publish validation. The
        documentation baseline for integrators and payload generation.
      operationId: jobTypeCatalog
      x-permission: any logged-in user
      responses:
        "200":
          description: Declarative registry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobTypes:
                    type: array
                    items:
                      type: object
                      description: Schema per type (name/label/fields...) — driven by the server.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/archive:
    get:
      tags: [Archives]
      summary: Lists archived dailies (ADV-5)
      description: |
        The NDJSON files the post-daily retention GC writes into
        `settings.archive_dir`. Admin-only (an archive carries output and
        snapshots from ALL folders — it does not go through per-team RBAC).
      operationId: listArchives
      x-permission: admin
      responses:
        "200":
          description: Available files (sorted by name/day).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/archive/{file}:
    get:
      tags: [Archives]
      summary: Downloads one day's NDJSON (ADV-5)
      operationId: downloadArchive
      x-permission: admin
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: "^instances-\\d{4}-\\d{2}-\\d{2}(-\\d+)?\\.ndjson$" }
          description: The exact name in the instances-YYYY-MM-DD[-N].ndjson format (anything else is a 400).
      responses:
        "200":
          description: File streamed (Content-Disposition attachment).
          content:
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Archive not found.
          content:
            text/plain:
              schema: { type: string }
  /api/scheduler/tick:
    post:
      tags: [Scheduler]
      summary: On-demand tick (serverless mode)
      description: |
        Fires one scheduling cycle (materializes the daily if it is due +
        dispatch). Designed for `-scheduler=external`, where an external cron
        (Cloud Scheduler, k8s CronJob, GitHub Actions) hits this instead of the
        internal ticker. Idempotent and leader-guarded — safe to call
        frequently. In serverless, a per-tick lock serializes overlapping ticks
        across containers (ARCH-3).
      operationId: schedulerTick
      x-permission: operator/admin
      responses:
        "200":
          description: Cycle executed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/scheduler/daily:
    post:
      tags: [Scheduler]
      summary: Dedicated daily trigger (serverless mode)
      description: |
        Materializes today's daily IF the configured time has passed and it has
        not run yet (idempotent, leader-guarded), **without** running the
        dispatch cycle. Designed to split the cadences in serverless: a
        minute-level cron on `/scheduler/tick` (dispatch) and a **daily** cron
        here (materialization) — instead of every tick checking the daily.
      operationId: schedulerDaily
      x-permission: operator/admin
      responses:
        "200":
          description: Check executed (materialized if due).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  orderDate: { type: string, format: date, description: '"Today" in the business timezone.' }
                  at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /qa/{token}:
    get:
      tags: [Quick actions]
      summary: Quick action confirmation page (D-15)
      description: |
        A signed link (HMAC, 24h TTL, single instance+action scope) that
        arrives with the alert. GET NEVER executes — a link preview in a chat
        must not trigger a rerun; the page shows the button that does the POST.
        No Authorization header: the signed token itself is the auth.
      operationId: quickActionPage
      security: []
      x-permission: public (auth = the link's HMAC token)
      parameters: [{ $ref: "#/components/parameters/qaToken" }]
      responses:
        "200":
          description: HTML confirmation page (mobile-first, self-contained).
          content:
            text/html:
              schema: { type: string }
        "403":
          description: Invalid token (HTML).
          content:
            text/html:
              schema: { type: string }
        "410":
          description: Expired token (HTML).
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [Quick actions]
      summary: Executes the quick action
      description: |
        Verifies the token and EXECUTES the embedded action (same semantics as
        the lifecycle handlers; actor = "quick-action"). The response is
        feedback HTML.
      operationId: quickActionExec
      security: []
      x-permission: public (auth = the link's HMAC token)
      parameters: [{ $ref: "#/components/parameters/qaToken" }]
      responses:
        "200":
          description: Action applied (confirmation HTML).
          content:
            text/html:
              schema: { type: string }
        "403":
          description: Invalid token (HTML).
          content:
            text/html:
              schema: { type: string }
        "409":
          description: Action not applied — the instance's state does not allow it (HTML).
          content:
            text/html:
              schema: { type: string }
        "410":
          description: Expired token (HTML).
          content:
            text/html:
              schema: { type: string }
