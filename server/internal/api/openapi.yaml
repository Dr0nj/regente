components:
  securitySchemes:
    machineAuth:
      type: http
      scheme: bearer
      description: Scoped machine credential issued for an agent/environment/capabilities; human tokens are rejected.
    bearerAuth:
      type: http
      scheme: bearer
      description: Non-browser API login session, or static REGENTE_TOKEN (= admin) in local/hybrid mode. Not an HttpOnly browser session, OIDC provider token or agent machine credential. Static tokens do not bypass oidc mode.
  parameters:
    instanceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The instance ID (e.g. the `id` returned by the composed query).
    qaToken:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: Signed HMAC token (issued by alerting; 24h TTL).
  responses:
    BadRequest:
      description: Invalid request (raw message in text/plain).
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Missing/invalid credentials or session source rejected by the authentication mode.
      content:
        text/plain:
          schema: { type: string, example: unauthorized }
    Forbidden:
      description: Invalid session transport/CSRF, or insufficient role/ACL (writer, admin or folder write access).
      content:
        text/plain:
          schema: { type: string, example: forbidden }
  schemas:
    LabOrderRequest:
      type: object
      additionalProperties: false
      required: [sourceInstanceId, idempotencyKey]
      properties:
        sourceInstanceId: { type: string }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    LabOrder:
      type: object
      properties:
        id: { type: string }
        sourceInstanceId: { type: string }
        state: { type: string }
        currentExecution: { type: string }
        attempt: { type: integer }
        fence: { type: integer, format: int64 }
    LabAttemptRequest:
      type: object
      additionalProperties: false
      required: [agentId, idempotencyKey, intent]
      properties:
        agentId: { type: string }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        intent: { type: string, enum: [start, retry, rerun] }
    ExecutionAttempt:
      type: object
      properties:
        executionId: { type: string }
        orderId: { type: string }
        attempt: { type: integer }
        fence: { type: integer, format: int64 }
        agentId: { type: string }
        state: { type: string, enum: [dispatch_pending, dispatching, accepted, running, cancel_requested, uncertain, succeeded, failed, cancelled] }
        leaseUntil: { type: integer, format: int64, description: UTC Unix milliseconds. }
        acceptedAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    ExecutionIdentity:
      type: object
      required: [protocol, executionId, fence]
      properties:
        protocol: { type: integer, enum: [2] }
        executionId: { type: string }
        fence: { type: integer, format: int64 }
    ExecutionAck:
      allOf:
        - { $ref: '#/components/schemas/ExecutionIdentity' }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [accepted, started, heartbeat, cancelled] }
    ExecutionResult:
      allOf:
        - { $ref: '#/components/schemas/ExecutionIdentity' }
        - type: object
          required: [exitCode, output]
          properties:
            exitCode: { type: integer }
            output: { type: string, description: At most 5 MiB in UTF-8 bytes. }
    ExecutionOutput:
      allOf:
        - { $ref: '#/components/schemas/ExecutionIdentity' }
        - type: object
          required: [seq, chunk]
          properties:
            seq: { type: integer, format: int64, minimum: 1 }
            chunk: { type: string, minLength: 1 }
    ExecutionReceipt:
      type: object
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        executionId: { type: string }
    ExecutionEnvelope:
      type: object
      properties:
        protocol: { type: integer, enum: [2] }
        kind: { type: string, enum: [dispatch, cancel] }
        messageId: { type: string }
        executionId: { type: string }
        orderId: { type: string }
        attempt: { type: integer }
        agentId: { type: string }
        fence: { type: integer, format: int64 }
        idempotencyKey: { type: string }
        definition: { type: object, description: Frozen definition present only on dispatch. }
    ExecutionChunks:
      type: array
      items:
        type: object
        properties:
          seq: { type: integer, format: int64 }
          chunk: { type: string }

    BusinessTime:
      type: object
      required: [timezone, dailyAt]
      properties:
        timezone: { type: string, description: Frozen IANA timezone. }
        dailyAt: { type: string, description: Frozen rollover in HH:MM. }
    Instance:
      type: object
      description: |
        One instance in the daily (an IMMUTABLE snapshot of the order —
        team/dryRun and friends freeze at the moment the job is ordered).
      properties:
        businessTime: { $ref: "#/components/schemas/BusinessTime" }
        id: { type: string }
        definitionId: { type: string }
        team: { type: string, description: The folder (frozen on the order). }
        orderDate: { type: string, format: date }
        status:
          type: string
          enum: [WAITING, RUNNING, OK, NOTOK, HELD, CANCELLED]
        scheduledAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        agentId: { type: string }
        exitCode: { type: integer }
        output: { type: string }
        forced: { type: boolean }
        carriedFrom:
          type: string
          format: date
          description: The day of origin if it came from another daily's carry-over.
        confirmed: { type: boolean, description: "Confirm gate opened (jobs with confirm: true)." }
        cycleRuns: { type: integer, description: OK laps completed during the day (cyclic jobs). }
        dryRun: { type: boolean, description: Frozen on the order (the GHOST badge). }
    InstanceDetail:
      allOf:
        - $ref: "#/components/schemas/Instance"
        - type: object
          description: Fields extracted from definition_snapshot (the photo of the order).
          properties:
            label: { type: string, description: The job label frozen on the order. }
            jobType: { type: string, description: The job type (COMMAND/SCRIPT/...) frozen on the order. }
            snapshotError: { type: string, description: Present invalid snapshots are blocked; live definitions are not substituted. }
            snapshotDef: { type: object, additionalProperties: true, description: Frozen order definition; absent for legacy or invalid snapshots. }
            actionConfig:
              type: object
              additionalProperties: true
              description: Action parameters (e.g. command/cwd) frozen on the order — what the dispatch executes.
    StructuredQuery:
      type: object
      description: Everything optional; the zero value means today's daily, unfiltered. An unknown field is a 400.
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: An exact day (YYYY-MM-DD). }
        from: { type: string, format: date, description: ...or an inclusive from..to range. }
        to: { type: string, format: date }
        folders:
          type: array
          items: { type: string }
          description: IN over the folder/team.
        statuses:
          type: array
          items: { type: string }
          description: IN over the status (WAITING/RUNNING/OK/NOTOK/HELD/CANCELLED).
        search: { type: string, description: LIKE over id / definitionId. }
        defIdPrefix: { type: string, description: definitionId LIKE 'prefix%'. }
        forced: { type: boolean, description: Only forced ones (true) / only non-forced ones (false). }
        carried: { type: boolean, description: Only carry-overs from another daily (true) / only native ones (false). }
        late: { type: boolean, description: "true = WAITING with scheduledAt in the past (late)." }
        groupBy:
          type: string
          enum: [status, folder, definition]
          description: Aggregation in the database — switches the response to the grouped shape.
        limit: { type: integer, default: 500, maximum: 5000 }
        cursor: { type: string, description: Keyset — the id of the last item on the previous page. }
    QueryResultList:
      type: object
      description: The paginated shape (without groupBy).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Instance" }
        nextCursor:
          type: string
          description: Pass it back in `cursor` for the next page; empty means there is nothing left.
    QueryResultGrouped:
      type: object
      description: The aggregated shape (with groupBy) — counters straight from the database, no row materialized.
      properties:
        groupBy: { type: string }
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              count: { type: integer }
        total: { type: integer }
    IngestEvent:
      type: object
      description: Requires conditions[] (or condition) and/or forceJob.
      properties:
        id:
          type: string
          description: The SENDER's dedupe key (PK). Omitted means no dedupe — every POST applies.
        source: { type: string, description: Who sent it (becomes the actor "external:<source>"). }
        kind: { type: string, description: 'A free-form label for the event type (file-arrived, job-done...).' }
        condition: { type: string, description: Shorthand for a single condition. }
        conditions:
          type: array
          items: { type: string }
          description: Conditions to set (date-scoped).
        forceJob: { type: string, description: The definition to force into the daily. }
        date: { type: string, format: date, description: Scope of the conditions; defaults to today (business tz). }
    IngestResult:
      type: object
      properties:
        id: { type: string }
        duplicate: { type: boolean }
        applied:
          description: |
            The list of what was applied (with partial ERRORs inline) — or the
            boolean `false` when it is a duplicate (nothing reapplied).
          oneOf:
            - type: array
              items: { type: string }
            - type: boolean
    ExternalEvent:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        kind: { type: string }
        applied: { type: string, description: A "; "-separated summary of what the event caused. }
        receivedAt: { type: string, format: date-time }
    ActionResult:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
    DailyMaterialization:
      type: object
      properties:
        orderDate: { type: string, format: date }
        state: { type: string, enum: [legacy, planning, materializing, completed, failed] }
        commitSha: { type: string }
        expected: { type: integer }
        inserted: { type: integer }
        checkpoint: { type: integer }
        carried: { type: integer }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        canResume: { type: boolean }
    DailyStatus:
      type: object
      properties:
        orderDate: { type: string, format: date, description: '"Today" in the business timezone.' }
        dailyAt: { type: string, description: The configured time (HH:MM). }
        timezone: { type: string, description: Explicit IANA business timezone (settings.daily_timezone); default UTC. }
        run: { $ref: "#/components/schemas/DailyMaterialization" }
        pending: { $ref: "#/components/schemas/DailyMaterialization" }
        lastRunDate: { type: string, format: date }
        lastRunAt: { type: string }
        serverNow: { type: string, format: date-time }
    DailyReport:
      type: object
      properties:
        materialization: { $ref: "#/components/schemas/DailyMaterialization" }
        date: { type: string, format: date }
        dailyAt: { type: string }
        timezone: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        lateStart:
          type: boolean
          description: Materialized >5 min after the configured time (the scheduler's punctuality SLO).
        closed:
          type: boolean
          description: Materialization completed or legacy and nothing WAITING/RUNNING — the day closed (the push trigger).
        counts: { $ref: "#/components/schemas/DailyReportCounts" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/DailyReportFailure" }
          description: Capped at 100 items; counts.notok is always exact.
        slaBreaches:
          type: array
          items: { $ref: "#/components/schemas/SLABreach" }
        reportSent: { type: boolean, description: The daily push was already sent (report_sent_at). }
    DailyReportCounts:
      type: object
      properties:
        ordered: { type: integer, description: Total instances for the orderDate. }
        ok: { type: integer }
        notok: { type: integer }
        waiting: { type: integer }
        running: { type: integer }
        held: { type: integer }
        cancelled: { type: integer }
        carried: { type: integer, description: Came from earlier dailies (carry-over). }
    DailyReportFailure:
      type: object
      properties:
        defId: { type: string }
        team: { type: string }
        exitCode: { type: integer }
        finishedAt: { type: string, format: date-time, nullable: true }
    SLABreach:
      type: object
      properties:
        id: { type: integer }
        instanceId: { type: string }
        definitionId: { type: string }
        kind: { type: string, enum: [duration, deadline] }
        severity: { type: string }
        message: { type: string }
        detectedAt: { type: string, format: date-time }
        notified: { type: boolean }
    ForecastReport:
      type: object
      properties:
        businessTime: { $ref: "#/components/schemas/BusinessTime" }
        orderDate: { type: string, format: date }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ForecastJob" }
        peakResourceUsage:
          type: object
          additionalProperties: { type: integer }
          description: Projected peak usage per resource.
    ForecastJob:
      type: object
      properties:
        defId: { type: string }
        label: { type: string }
        team: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        eligible: { type: boolean }
        reason: { type: string, description: 'Why it does not run ("no calendar match", "blocked by deps"...).' }
        wave: { type: integer, description: Topological order (0 = root). }
        wouldBreachSla: { type: boolean }
    ArchiveList:
      type: object
      properties:
        dir: { type: string }
        archives:
          type: array
          items: { $ref: "#/components/schemas/ArchiveItem" }
    ArchiveItem:
      type: object
      properties:
        file: { type: string, example: instances-2026-07-01.ndjson }
        day: { type: string, format: date }
        sizeBytes: { type: integer }
        modifiedAt: { type: string, format: date-time }
    Readyz:
      type: object
      properties:
        ready: { type: boolean }
        db:
          type: object
          properties:
            ok: { type: boolean }
            detail: { type: string }
        leader:
          type: object
          description: Informational — a follower is ready.
          properties:
            ok: { type: boolean }
            detail: { type: string, enum: [leader, follower] }
        schedulerLastTickAgeSeconds: { type: number }
        schedulerStale: { type: boolean, description: 'Last tick more than 120s ago (informational, does not fail).' }
        lastDaily: { type: string, format: date }
