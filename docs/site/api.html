<!doctype html>
<!-- API-1 — viewer do contrato OpenAPI, self-contained (zero CDN, zero build):
     renderiza /api-docs/openapi.json com JS vanilla, no espírito do resto do
     hosting (docsite ADV-7, qaHTML). Try-it embutido: single-origin, então o
     fetch bate direto na API com o Bearer que o usuário colar. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regente — integration API</title>
<style>
  /* Paleta alinhada à identidade do Regente: dark verde-tingido + accent
     #11c76f, o MESMO do site de docs (cmd/docsite). Página standalone
     (go:embed), então é fixa — não os 13 temas do SPA (que vivem no
     tokens.css do front e no localStorage). Badges por método mantêm cores
     semânticas pra escaneabilidade (convenção de API docs). */
  :root{
    --bg:#0b0f0d; --panel:#111613; --panel2:#171f1a; --border:#1f2a24;
    --text:#d7e2dc; --muted:#8aa096; --code:#0d120f; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --get:#38bdf8; --post:#11c76f; --put:#f5b642; --delete:#f87171; --accent:#11c76f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code,pre{font-family:var(--mono)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 20px;background:rgba(11,15,13,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  header .brand{font-weight:700;letter-spacing:.12em}
  header .brand small{color:var(--muted);font-weight:400;letter-spacing:0;margin-left:8px}
  header .links{font-size:13px;color:var(--muted)}
  header input{margin-left:auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;font:13px var(--mono);width:min(340px,90vw)}
  header input::placeholder{color:var(--muted)}
  .layout{display:grid;grid-template-columns:264px 1fr;max-width:1240px;margin:0 auto}
  nav{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;padding:20px 8px 40px 20px}
  nav h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
  nav a{display:flex;gap:8px;align-items:baseline;padding:3px 8px;border-radius:6px;color:var(--text);font-size:13px}
  nav a:hover{background:var(--panel2);text-decoration:none}
  nav .m{font:700 10px var(--mono);width:38px;flex:none;text-align:right}
  main{padding:24px 20px 80px;min-width:0}
  .intro{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:28px}
  .intro h1{font-size:20px;margin-bottom:4px}
  .intro .ver{color:var(--muted);font-size:13px;margin-bottom:12px}
  section.tag>h2{font-size:17px;margin:34px 0 4px;padding-top:8px}
  section.tag>p.tagdesc{color:var(--muted);margin-bottom:14px}
  .op{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:14px 0;overflow:hidden}
  .op>summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none;flex-wrap:wrap}
  .op>summary::-webkit-details-marker{display:none}
  .op>summary:hover{background:var(--panel2)}
  .badge{font:700 11px var(--mono);padding:3px 9px;border-radius:6px;color:#07100b;min-width:52px;text-align:center}
  .badge.get{background:var(--get)} .badge.post{background:var(--post)}
  .badge.put{background:var(--put)} .badge.delete{background:var(--delete)}
  .path{font:600 13.5px var(--mono);word-break:break-all}
  .sum{color:var(--muted);font-size:13px}
  .perm{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap}
  .opbody{padding:4px 18px 18px;border-top:1px solid var(--border)}
  .opbody h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
  .desc{color:#c2d0c8}
  .desc p{margin:8px 0} .desc h4{margin-top:14px} .desc code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px}
  .desc b{color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td code{font-size:12.5px}
  .req{color:var(--delete);font-size:11px;margin-left:4px}
  pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.5}
  .schema{font-size:12.5px}
  .schema ul{list-style:none;padding-left:18px;border-left:1px dotted var(--border);margin:2px 0}
  .schema>ul{padding-left:0;border-left:none}
  .schema li{margin:3px 0}
  .schema .t{color:var(--accent)} .schema .d{color:var(--muted)} .schema .n{color:var(--text);font-family:var(--mono)}
  .resp{margin:6px 0;padding:8px 12px;background:var(--panel2);border-radius:8px}
  .resp .code{font:700 12px var(--mono);margin-right:10px}
  .resp .c2xx{color:var(--post)} .resp .c4xx{color:var(--put)} .resp .c5xx{color:var(--delete)}
  .try{margin-top:14px;border:1px dashed var(--border);border-radius:10px;padding:12px 14px;background:rgba(17,199,111,.05)}
  .try label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  .try input,.try textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;font:12.5px var(--mono)}
  .try textarea{min-height:110px;resize:vertical}
  .try button{margin-top:10px;background:var(--accent);color:#07100b;font-weight:600;border:0;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer}
  .try button:hover{background:#0fb163}
  .try .out{margin-top:10px;display:none}
  .try .status{font:700 12px var(--mono);margin-bottom:6px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
  /* Modo estático (docsite): não há server atrás da página — o campo de token
     não serve pra nada e o aviso explica onde o Try-it existe. */
  .staticnote{display:none;color:var(--muted);font-size:12px}
  .staticnote code{font:11.5px var(--mono);color:var(--text)}
  body.static #tok{display:none}
  body.static .staticnote{display:block}
  @media (max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;display:none}}
</style>
<script id="openapi-inline" type="application/json">{"openapi":"3.0.3","info":{"title":"Regente — integration API","version":"1.0","description":"**Curated** contract of Regente's integration surface: the routes an\nexternal system actually calls. The SPA's internal surface (Design\nsessions, users, settings, alerting...) is deliberately left out — it\nevolves with the UI and is not a contract.\n\n### Authentication\n`Authorization: Bearer \u003ctoken\u003e` on everything under `/api`, except where\nmarked public. The token is either a session issued by the UI login **or**\nthe deployment's static token (`REGENTE_TOKEN`, equivalent to admin — the\nsame one the Go SDK `pkg/client` and the `regente ops` CLI use). Auth\nerrors: `401` for a missing/invalid token, `403` for insufficient\nrole/ACL. Error bodies are `text/plain` (raw message), not JSON.\n\n### RBAC\nReads respect the user's folder ACLs (admin sees everything). Lifecycle\nactions require the `operator`/`admin` role **and** write access on the\ninstance's folder. Archives and export are admin-only.\n\n### The QUERY HTTP verb\n`POST /api/instances/query` also accepts the `QUERY` method (IETF httpbis\ndraft — safe/idempotent with a body), same handler and same contract.\nOpenAPI 3.0 cannot model custom verbs, so the POST form is documented\nhere; `QUERY` is progressive enhancement for clients that support it.\n\n### Ingest idempotency\n`POST /api/events/ingest` is idempotent on the SENDER's key (`id` + PK in\n`external_events`): an at-least-once retry answers `duplicate:true`\nwithout reapplying any effect. Without an `id`, every POST applies (no\nkey, no dedupe).\n"},"servers":[{"url":"/","description":"Single-origin — the server serves the API, the SPA, the docs and this contract on the same port."}],"tags":[{"name":"System","description":"Health/liveness/readiness and Prometheus metrics. Public (scraper/probe-friendly)."},{"name":"Query","description":"Typed composed query (D-5) and NL-query over the current day's state."},{"name":"Lifecycle","description":"Operational actions on an instance (classic enterprise parity) + Force Order."},{"name":"External events","description":"Idempotent ingestion (D-3) — another system unblocks jobs without polling."},{"name":"Daily","description":"State and report/SLO of the daily (E5)."},{"name":"Forecast","description":"Simulation of what the daily would materialize (F21/CTM-6). Read-only, never touches the database."},{"name":"Catalog","description":"JobTypes with a declared per-type schema (ADV-1)."},{"name":"Archives","description":"Dailies archived by the retention policy (ADV-5). Admin-only."},{"name":"Quick actions","description":"Single-scope HMAC links coming from alerts (D-15). The signed token IS the auth."},{"name":"Scheduler","description":"On-demand tick for the -scheduler=external mode (external cron)."}],"security":[{"bearerAuth":[]}],"paths":{"/health":{"get":{"tags":["System"],"summary":"Basic health check","operationId":"health","security":[],"x-permission":"public","responses":{"200":{"description":"Server is up.","content":{"application/json":{"schema":{"type":"object","properties":{"status":{"type":"string","example":"ok"}}}}}}}}},"/livez":{"get":{"tags":["System"],"summary":"Liveness (R2)","description":"200 for as long as the process serves HTTP. Reports the age of the\nscheduler's last tick (informational — it does NOT fail on a stale\ntick: under `-scheduler=external` the tick comes from cron and failing\nwould cause a restart loop).\n","operationId":"livez","security":[],"x-permission":"public","responses":{"200":{"description":"Process alive.","content":{"application/json":{"schema":{"type":"object","properties":{"alive":{"type":"boolean"},"schedulerLastTickAgeSeconds":{"type":"number","description":"-1 if the scheduler has never ticked."}}}}}}}}},"/readyz":{"get":{"tags":["System"],"summary":"Readiness (R3)","description":"\"Can this node serve correct answers?\" The hard gate is a reachable DB\n(503 without one — point the k8s readinessProbe here). Leadership and\ntick/daily age are REPORTED but never fail the check: a follower serves\nthe API normally.\n","operationId":"readyz","security":[],"x-permission":"public","responses":{"200":{"description":"Node ready.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Readyz"}}}},"503":{"description":"DB unreachable — take the node out of rotation.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Readyz"}}}}}}},"/metrics":{"get":{"tags":["System"],"summary":"Prometheus metrics (P17)","description":"Prometheus text format, no external dependency. Main gauges:\n`regente_up`, `regente_env_info{env}`, `regente_instances{status}`,\n`regente_agents_online`, `regente_sla_breaches_total`,\n`regente_git_drift`, `regente_scheduler_last_tick_age_seconds`,\n`regente_is_leader`, `regente_event_queue_depth`.\n","operationId":"metrics","security":[],"x-permission":"public","responses":{"200":{"description":"Prometheus exposition.","content":{"text/plain":{"schema":{"type":"string"},"example":"regente_up 1\nregente_instances{status=\"OK\"} 1234\nregente_is_leader 1\n"}}}}}},"/api/instances/query":{"post":{"tags":["Query"],"summary":"Typed composed query (D-5)","description":"Composed filtering beyond the query string of `/api/instances`: date\nranges, IN lists (folders/statuses), flags (forced/carried/late) and\naggregation (`groupBy`). STRICT parsing — an unknown field is a 400\n(this is not SQL-over-HTTP; every filter is typed and parameterized).\nAn empty body `{}` means today's daily, unfiltered. Keyset pagination\nvia `cursor` = the id of the last item on the previous page (only\nwithout `groupBy`).\n\nAlso accepts the `QUERY` HTTP method (same handler/contract).\n","operationId":"queryInstances","x-permission":"any logged-in user (reads filtered by folder ACLs)","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StructuredQuery"},"example":{"statuses":["NOTOK"],"limit":100}}}},"responses":{"200":{"description":"Paginated list (without groupBy) OR aggregation (with groupBy).","content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/QueryResultList"},{"$ref":"#/components/schemas/QueryResultGrouped"}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/query":{"post":{"tags":["Query"],"summary":"NL-query (text → structured query)","description":"Interprets a natural-language question (en/pt) about the current day —\n\"how many jobs failed today?\", \"why didn't etl-sales run?\" — and runs\nthe intent (summary/count/list/explain) against the database.\nDeterministic (an intent parser, no AI). The response returns the\ninterpreted intent plus the structured answer.\n","operationId":"nlQuery","x-permission":"any logged-in user (reads filtered by folder ACLs)","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["q"],"properties":{"q":{"type":"string","description":"The question","in natural language.":null}}},"example":{"q":"how many jobs failed today?"}}}},"responses":{"200":{"description":"Interpreted intent + answer.","content":{"application/json":{"schema":{"type":"object","properties":{"interpreted":{"type":"object","description":"How the question was understood (kind/status/folder/job)."},"answer":{"type":"object","description":"Structured answer (its shape varies with the kind — text/count/byStatus/items...)."}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/instances/{id}":{"get":{"tags":["Query"],"summary":"Detail of one instance (+ the order's frozen action)","description":"The full runtime row plus what the list deliberately does NOT carry\n(scale payload): `label`, `jobType` and `actionConfig` extracted from\nthe `definition_snapshot` — the photo of the definition frozen when the\ninstance was ordered, the SAME one the dispatch executes. Editing the\njob in Design after the order does not change this response. A folder\nthe user cannot read answers 404 (it does not leak existence).\n","operationId":"getInstance","x-permission":"any logged-in user (reads filtered by folder ACLs)","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Instance detail.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InstanceDetail"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"description":"Instance not found (or folder not readable).","content":{"text/plain":{"schema":{"type":"string"}}}}}},"delete":{"tags":["Lifecycle"],"summary":"Delete — removes the order (ONLY on HOLD)","description":"The classic \"Delete job\": removes the instance from the screen and from\nthe state store. Requires the job to be on HOLD — since RUNNING is not\nholdable, a job in execution is never deletable; any other status\nbecomes deletable by going through Hold first. The dependency-event\nledger stays intact: an OK consumption that was held remains spent (the\nrerun of a clone stays in WAIT EVENT); an unconsumed reservation goes\nback to the pool.\n","operationId":"deleteInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Removed.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"deleted"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Instance not found.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Not on HOLD (hold it first; RUNNING is not deletable).","content":{"text/plain":{"schema":{"type":"string"}}}}}}},"/api/instances/{id}/hold":{"post":{"tags":["Lifecycle"],"summary":"Hold — holds an instance (any status except RUNNING)","description":"General hold: any status → HELD, except RUNNING (409 — the execution is\nalready on the agent; cancel it or wait) and HELD itself (an idempotent\nno-op that echoes the current state). The original status is frozen in\n`heldFromStatus` and Release restores THAT — holding an OK and\nreleasing it re-executes nothing.\n","operationId":"holdInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Hold applied (or a no-op if it was already HELD).","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"HELD"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"409":{"description":"RUNNING cannot be held.","content":{"text/plain":{"schema":{"type":"string"}}}}}}},"/api/instances/{id}/release":{"post":{"tags":["Lifecycle"],"summary":"Release — releases a HELD instance","description":"HELD → the ORIGINAL status frozen by the hold (`heldFromStatus`; legacy\nholds without it fall back to WAITING). A released WAITING re-enters\nnormal gating on the next tick; a released OK/NOTOK simply goes back to\nbeing OK/NOTOK. A job held by a FOLDER PAUSE answers 409 — only the\nfolder resume releases it.\n","operationId":"releaseInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Release applied (or a no-op if it was not HELD).","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"WAITING"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"409":{"description":"Held by a folder pause (release it through the folder).","content":{"text/plain":{"schema":{"type":"string"}}}}}}},"/api/instances/{id}/cancel":{"post":{"tags":["Lifecycle"],"summary":"Cancel — cancels the instance","description":"Marks it CANCELLED (unconditionally) and closes finished_at.","operationId":"cancelInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Cancelled.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"CANCELLED"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/instances/{id}/rerun":{"post":{"tags":["Lifecycle"],"summary":"Rerun — resets to WAITING","description":"Clears started/finished/exitCode/output and goes back to WAITING. The\n`confirmed` flag SURVIVES the rerun (BUG-2): an already-confirmed job\ndoes not fall back to the CONFIRM gate. Pending alerts for the job are\nmarked as handled; the tick is nudged — with the gates satisfied, the\njob goes in right away.\n","operationId":"rerunInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Reset to WAITING.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"WAITING"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/instances/{id}/set-ok":{"post":{"tags":["Lifecycle"],"summary":"Set OK — flips WAITING/NOTOK/CANCELLED → OK","description":"The classic \"Set OK\": marks it OK, publishes the dependency event and\nMATERIALIZES the ConditionsOut — unblocking the on-success successors.\nIt also applies to WAITING (a job stuck on WAIT EVENT finishes OK right\naway, BUG-3). 400 if the instance is not in an eligible state (e.g.\nRUNNING).\n","operationId":"setOKInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Marked OK.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActionResult"},"example":{"id":"etl-sales_2026-07-10_a1b2","status":"OK"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/instances/{id}/confirm":{"post":{"tags":["Lifecycle"],"summary":"Confirm — opens the WAIT_CONFIRM gate","description":"The classic \"Confirm\": releases a job defined with `confirm: true`. It\napplies to WAITING and HELD (confirming while held counts; it runs once\nreleased). Not even Force bypasses this gate — only Confirm. It nudges\nthe tick: confirmed, dispatched.\n","operationId":"confirmInstance","x-permission":"operator/admin + write access on the instance's folder","parameters":[{"$ref":"#/components/parameters/instanceId"}],"responses":{"200":{"description":"Confirmed.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/ActionResult"},{"type":"object","properties":{"confirmed":{"type":"boolean"}}}]},"example":{"id":"closing_2026-07-10_c3d4","status":"WAITING","confirmed":true}}}},"400":{"description":"Instance not found, or not on WAITING/HELD.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/definitions/{id}/force":{"post":{"tags":["Lifecycle"],"summary":"Force Order — materializes the published def into today's daily","description":"The classic \"Order Force\": creates an instance from the most current\nPUBLISHED definition, right now, in today's daily (the regular daily is\nan immutable photo; force picks up the live def — only for the forced\njob).\n","operationId":"forceOrder","x-permission":"operator/admin + write access on the definition's folder","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"},"description":"The definition ID (the YAML id in the workspace)."}],"responses":{"200":{"description":"Instance created.","content":{"application/json":{"schema":{"type":"object","properties":{"instanceId":{"type":"string"}}},"example":{"instanceId":"etl-sales_2026-07-10_f0rc"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Definition not found.","content":{"text/plain":{"schema":{"type":"string"}}}}}}},"/api/events/ingest":{"post":{"tags":["External events"],"summary":"Idempotent ingestion of an external event (D-3)","description":"Another system (CDC, pipeline, vendor webhook) reports that something\nhappened — and that unblocks jobs WITHOUT polling: it sets conditions\n(scoped by `date`, defaulting to today in the business timezone) and/or\nforces a job.\n\n**Idempotent** on the sender's key: `id` is the PK — an at-least-once\nretry answers `duplicate: true` without reapplying. **Persisted**: the\nevent and what it caused (`applied`) stay in the table (forensics for\n\"who unblocked this job at 03:14\"). **Immediate**: it nudges the tick.\n\nRequires `conditions[]` (or `condition`) and/or `forceJob` — nothing to\napply is a 400.\n","operationId":"ingestEvent","x-permission":"operator/admin","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/IngestEvent"},"example":{"id":"order-batch-2026-07-10","source":"sap","kind":"file-arrived","conditions":["SALES_FILE_OK"],"forceJob":"etl-sales"}}}},"responses":{"200":{"description":"Event accepted. `duplicate: false` + `applied` (the list of what was\ndone, item by item, with partial ERRORs inline) — or\n`duplicate: true` + `applied: false` on a retry (nothing reapplied).\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/IngestResult"},"example":{"id":"order-batch-2026-07-10","duplicate":false,"applied":["condition SALES_FILE_OK@2026-07-10","force etl-sales → etl-sales_2026-07-10_a1b2"]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/events/external":{"get":{"tags":["External events"],"summary":"Latest ingested events (forensics/debug)","operationId":"listExternalEvents","x-permission":"any logged-in user","parameters":[{"name":"limit","in":"query","schema":{"type":"integer","default":100}}],"responses":{"200":{"description":"Most recent first.","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/ExternalEvent"}}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/daily/status":{"get":{"tags":["Daily"],"summary":"Daily state (business clock)","description":"Last materialization + the configured time (`settings.daily_at`) + the\nbusiness timezone (E1). `orderDate`/`serverNow` are in the business\ntimezone — that is the clock that decides what \"today\" means.\n","operationId":"dailyStatus","x-permission":"any logged-in user","responses":{"200":{"description":"Current state.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DailyStatus"}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/daily/report":{"get":{"tags":["Daily"],"summary":"Daily report/SLO (E5)","description":"The summary operations asks for at the end of the day: counts per\nstate, punctuality of the materialization (`lateStart`, 5-minute\ntolerance), whether the day \"closed\" (`closed` — nothing\nWAITING/RUNNING), failures (capped at 100, the count is always exact)\nand SLA breaches. It is also the payload of the optional push\n(`daily_report_channels`).\n","operationId":"dailyReport","x-permission":"any logged-in user","parameters":[{"name":"date","in":"query","schema":{"type":"string","format":"date"},"description":"YYYY-MM-DD; defaults to today's daily in the business timezone."}],"responses":{"200":{"description":"Aggregated report.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DailyReport"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/forecast":{"get":{"tags":["Forecast"],"summary":"Forecast for one day (F21)","description":"Simulates in RAM what the daily would materialize on `date`: who is\neligible (the SAME gating as RunDaily — frequency, include/exclude\ncalendars, shift, via IsScheduledOn), topological order (waves), blocks\nfrom deps/resources/conditions and projected SLA violations. It never\ntouches the database.\n","operationId":"getForecast","x-permission":"any logged-in user","parameters":[{"name":"date","in":"query","schema":{"type":"string","format":"date"},"description":"YYYY-MM-DD; defaults to today."}],"responses":{"200":{"description":"Simulation of the day.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ForecastReport"}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/forecast/range":{"get":{"tags":["Forecast"],"summary":"Forecast for N days ahead (CTM-6)","description":"One ForecastReport per day, same gating as RunDaily. The classic \"≥1 week\".","operationId":"getForecastRange","x-permission":"any logged-in user","parameters":[{"name":"from","in":"query","schema":{"type":"string","format":"date"},"description":"YYYY-MM-DD; defaults to today."},{"name":"days","in":"query","schema":{"type":"integer","default":7,"minimum":1,"maximum":366}}],"responses":{"200":{"description":"One report per day.","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/ForecastReport"}}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/jobtypes":{"get":{"tags":["Catalog"],"summary":"JobType catalog (ADV-1)","description":"The DEDICATED schema of every jobType (fields, required ones, kinds,\nenums, aliases), straight from the registry the validator uses — the\nsame source as the DRAFT-on-save / STRICT-on-publish validation. The\ndocumentation baseline for integrators and payload generation.\n","operationId":"jobTypeCatalog","x-permission":"any logged-in user","responses":{"200":{"description":"Declarative registry.","content":{"application/json":{"schema":{"type":"object","properties":{"jobTypes":{"type":"array","items":{"type":"object","description":"Schema per type (name/label/fields...) — driven by the server."}}}}}}},"401":{"$ref":"#/components/responses/Unauthorized"}}}},"/api/archive":{"get":{"tags":["Archives"],"summary":"Lists archived dailies (ADV-5)","description":"The NDJSON files the post-daily retention GC writes into\n`settings.archive_dir`. Admin-only (an archive carries output and\nsnapshots from ALL folders — it does not go through per-team RBAC).\n","operationId":"listArchives","x-permission":"admin","responses":{"200":{"description":"Available files (sorted by name/day).","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ArchiveList"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/archive/{file}":{"get":{"tags":["Archives"],"summary":"Downloads one day's NDJSON (ADV-5)","operationId":"downloadArchive","x-permission":"admin","parameters":[{"name":"file","in":"path","required":true,"schema":{"type":"string","pattern":"^instances-\\d{4}-\\d{2}-\\d{2}(-\\d+)?\\.ndjson$"},"description":"The exact name in the instances-YYYY-MM-DD[-N].ndjson format (anything else is a 400)."}],"responses":{"200":{"description":"File streamed (Content-Disposition attachment).","content":{"application/x-ndjson":{"schema":{"type":"string"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Archive not found.","content":{"text/plain":{"schema":{"type":"string"}}}}}}},"/api/scheduler/tick":{"post":{"tags":["Scheduler"],"summary":"On-demand tick (serverless mode)","description":"Fires one scheduling cycle (materializes the daily if it is due +\ndispatch). Designed for `-scheduler=external`, where an external cron\n(Cloud Scheduler, k8s CronJob, GitHub Actions) hits this instead of the\ninternal ticker. Idempotent and leader-guarded — safe to call\nfrequently. In serverless, a per-tick lock serializes overlapping ticks\nacross containers (ARCH-3).\n","operationId":"schedulerTick","x-permission":"operator/admin","responses":{"200":{"description":"Cycle executed.","content":{"application/json":{"schema":{"type":"object","properties":{"ok":{"type":"boolean"},"at":{"type":"string","format":"date-time"}}}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/scheduler/daily":{"post":{"tags":["Scheduler"],"summary":"Dedicated daily trigger (serverless mode)","description":"Materializes today's daily IF the configured time has passed and it has\nnot run yet (idempotent, leader-guarded), **without** running the\ndispatch cycle. Designed to split the cadences in serverless: a\nminute-level cron on `/scheduler/tick` (dispatch) and a **daily** cron\nhere (materialization) — instead of every tick checking the daily.\n","operationId":"schedulerDaily","x-permission":"operator/admin","responses":{"200":{"description":"Check executed (materialized if due).","content":{"application/json":{"schema":{"type":"object","properties":{"ok":{"type":"boolean"},"orderDate":{"type":"string","format":"date","description":"\"Today\" in the business timezone."},"at":{"type":"string","format":"date-time"}}}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/qa/{token}":{"get":{"tags":["Quick actions"],"summary":"Quick action confirmation page (D-15)","description":"A signed link (HMAC, 24h TTL, single instance+action scope) that\narrives with the alert. GET NEVER executes — a link preview in a chat\nmust not trigger a rerun; the page shows the button that does the POST.\nNo Authorization header: the signed token itself is the auth.\n","operationId":"quickActionPage","security":[],"x-permission":"public (auth = the link's HMAC token)","parameters":[{"$ref":"#/components/parameters/qaToken"}],"responses":{"200":{"description":"HTML confirmation page (mobile-first, self-contained).","content":{"text/html":{"schema":{"type":"string"}}}},"403":{"description":"Invalid token (HTML).","content":{"text/html":{"schema":{"type":"string"}}}},"410":{"description":"Expired token (HTML).","content":{"text/html":{"schema":{"type":"string"}}}}}},"post":{"tags":["Quick actions"],"summary":"Executes the quick action","description":"Verifies the token and EXECUTES the embedded action (same semantics as\nthe lifecycle handlers; actor = \"quick-action\"). The response is\nfeedback HTML.\n","operationId":"quickActionExec","security":[],"x-permission":"public (auth = the link's HMAC token)","parameters":[{"$ref":"#/components/parameters/qaToken"}],"responses":{"200":{"description":"Action applied (confirmation HTML).","content":{"text/html":{"schema":{"type":"string"}}}},"403":{"description":"Invalid token (HTML).","content":{"text/html":{"schema":{"type":"string"}}}},"409":{"description":"Action not applied — the instance's state does not allow it (HTML).","content":{"text/html":{"schema":{"type":"string"}}}},"410":{"description":"Expired token (HTML).","content":{"text/html":{"schema":{"type":"string"}}}}}}}},"components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","description":"A login session OR the deployment's static token (REGENTE_TOKEN = admin)."}},"parameters":{"instanceId":{"name":"id","in":"path","required":true,"schema":{"type":"string"},"description":"The instance ID (e.g. the `id` returned by the composed query)."},"qaToken":{"name":"token","in":"path","required":true,"schema":{"type":"string"},"description":"Signed HMAC token (issued by alerting; 24h TTL)."}},"responses":{"BadRequest":{"description":"Invalid request (raw message in text/plain).","content":{"text/plain":{"schema":{"type":"string"}}}},"Unauthorized":{"description":"Missing or invalid token.","content":{"text/plain":{"schema":{"type":"string","example":"unauthorized"}}}},"Forbidden":{"description":"Insufficient role/ACL (writer, admin or write access on the folder).","content":{"text/plain":{"schema":{"type":"string","example":"forbidden"}}}}},"schemas":{"Instance":{"type":"object","description":"One instance in the daily (an IMMUTABLE snapshot of the order —\nteam/dryRun and friends freeze at the moment the job is ordered).\n","properties":{"id":{"type":"string"},"definitionId":{"type":"string"},"team":{"type":"string","description":"The folder (frozen on the order)."},"orderDate":{"type":"string","format":"date"},"status":{"type":"string","enum":["WAITING","RUNNING","OK","NOTOK","HELD","CANCELLED"]},"scheduledAt":{"type":"string","format":"date-time"},"startedAt":{"type":"string","format":"date-time","nullable":true},"finishedAt":{"type":"string","format":"date-time","nullable":true},"agentId":{"type":"string"},"exitCode":{"type":"integer"},"output":{"type":"string"},"forced":{"type":"boolean"},"carriedFrom":{"type":"string","format":"date","description":"The day of origin if it came from another daily's carry-over."},"confirmed":{"type":"boolean","description":"Confirm gate opened (jobs with confirm: true)."},"cycleRuns":{"type":"integer","description":"OK laps completed during the day (cyclic jobs)."},"dryRun":{"type":"boolean","description":"Frozen on the order (the GHOST badge)."}}},"InstanceDetail":{"allOf":[{"$ref":"#/components/schemas/Instance"},{"type":"object","description":"Fields extracted from definition_snapshot (the photo of the order).","properties":{"label":{"type":"string","description":"The job label frozen on the order."},"jobType":{"type":"string","description":"The job type (COMMAND/SCRIPT/...) frozen on the order."},"actionConfig":{"type":"object","additionalProperties":true,"description":"Action parameters (e.g. command/cwd) frozen on the order — what the dispatch executes."}}}]},"StructuredQuery":{"type":"object","description":"Everything optional; the zero value means today's daily, unfiltered. An unknown field is a 400.","additionalProperties":false,"properties":{"date":{"type":"string","format":"date","description":"An exact day (YYYY-MM-DD)."},"from":{"type":"string","format":"date","description":"...or an inclusive from..to range."},"to":{"type":"string","format":"date"},"folders":{"type":"array","items":{"type":"string"},"description":"IN over the folder/team."},"statuses":{"type":"array","items":{"type":"string"},"description":"IN over the status (WAITING/RUNNING/OK/NOTOK/HELD/CANCELLED)."},"search":{"type":"string","description":"LIKE over id / definitionId."},"defIdPrefix":{"type":"string","description":"definitionId LIKE 'prefix%'."},"forced":{"type":"boolean","description":"Only forced ones (true) / only non-forced ones (false)."},"carried":{"type":"boolean","description":"Only carry-overs from another daily (true) / only native ones (false)."},"late":{"type":"boolean","description":"true = WAITING with scheduledAt in the past (late)."},"groupBy":{"type":"string","enum":["status","folder","definition"],"description":"Aggregation in the database — switches the response to the grouped shape."},"limit":{"type":"integer","default":500,"maximum":5000},"cursor":{"type":"string","description":"Keyset — the id of the last item on the previous page."}}},"QueryResultList":{"type":"object","description":"The paginated shape (without groupBy).","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/Instance"}},"nextCursor":{"type":"string","description":"Pass it back in `cursor` for the next page; empty means there is nothing left."}}},"QueryResultGrouped":{"type":"object","description":"The aggregated shape (with groupBy) — counters straight from the database, no row materialized.","properties":{"groupBy":{"type":"string"},"groups":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"count":{"type":"integer"}}}},"total":{"type":"integer"}}},"IngestEvent":{"type":"object","description":"Requires conditions[] (or condition) and/or forceJob.","properties":{"id":{"type":"string","description":"The SENDER's dedupe key (PK). Omitted means no dedupe — every POST applies."},"source":{"type":"string","description":"Who sent it (becomes the actor \"external:\u003csource\u003e\")."},"kind":{"type":"string","description":"A free-form label for the event type (file-arrived, job-done...)."},"condition":{"type":"string","description":"Shorthand for a single condition."},"conditions":{"type":"array","items":{"type":"string"},"description":"Conditions to set (date-scoped)."},"forceJob":{"type":"string","description":"The definition to force into the daily."},"date":{"type":"string","format":"date","description":"Scope of the conditions; defaults to today (business tz)."}}},"IngestResult":{"type":"object","properties":{"id":{"type":"string"},"duplicate":{"type":"boolean"},"applied":{"description":"The list of what was applied (with partial ERRORs inline) — or the\nboolean `false` when it is a duplicate (nothing reapplied).\n","oneOf":[{"type":"array","items":{"type":"string"}},{"type":"boolean"}]}}},"ExternalEvent":{"type":"object","properties":{"id":{"type":"string"},"source":{"type":"string"},"kind":{"type":"string"},"applied":{"type":"string","description":"A \"; \"-separated summary of what the event caused."},"receivedAt":{"type":"string","format":"date-time"}}},"ActionResult":{"type":"object","properties":{"id":{"type":"string"},"status":{"type":"string"}}},"DailyStatus":{"type":"object","properties":{"orderDate":{"type":"string","format":"date","description":"\"Today\" in the business timezone."},"dailyAt":{"type":"string","description":"The configured time (HH:MM)."},"timezone":{"type":"string","description":"IANA (settings.daily_timezone); empty means the server's local clock."},"lastRunDate":{"type":"string","format":"date"},"lastRunAt":{"type":"string"},"serverNow":{"type":"string","format":"date-time"}}},"DailyReport":{"type":"object","properties":{"date":{"type":"string","format":"date"},"dailyAt":{"type":"string"},"timezone":{"type":"string"},"startedAt":{"type":"string","format":"date-time","nullable":true},"lateStart":{"type":"boolean","description":"Materialized \u003e5 min after the configured time (the scheduler's punctuality SLO)."},"closed":{"type":"boolean","description":"Nothing WAITING/RUNNING — the day closed (the push trigger)."},"counts":{"$ref":"#/components/schemas/DailyReportCounts"},"failures":{"type":"array","items":{"$ref":"#/components/schemas/DailyReportFailure"},"description":"Capped at 100 items; counts.notok is always exact."},"slaBreaches":{"type":"array","items":{"$ref":"#/components/schemas/SLABreach"}},"reportSent":{"type":"boolean","description":"The daily push was already sent (report_sent_at)."}}},"DailyReportCounts":{"type":"object","properties":{"ordered":{"type":"integer","description":"Total instances for the orderDate."},"ok":{"type":"integer"},"notok":{"type":"integer"},"waiting":{"type":"integer"},"running":{"type":"integer"},"held":{"type":"integer"},"cancelled":{"type":"integer"},"carried":{"type":"integer","description":"Came from earlier dailies (carry-over)."}}},"DailyReportFailure":{"type":"object","properties":{"defId":{"type":"string"},"team":{"type":"string"},"exitCode":{"type":"integer"},"finishedAt":{"type":"string","format":"date-time","nullable":true}}},"SLABreach":{"type":"object","properties":{"id":{"type":"integer"},"instanceId":{"type":"string"},"definitionId":{"type":"string"},"kind":{"type":"string","enum":["duration","deadline"]},"severity":{"type":"string"},"message":{"type":"string"},"detectedAt":{"type":"string","format":"date-time"},"notified":{"type":"boolean"}}},"ForecastReport":{"type":"object","properties":{"orderDate":{"type":"string","format":"date"},"jobs":{"type":"array","items":{"$ref":"#/components/schemas/ForecastJob"}},"peakResourceUsage":{"type":"object","additionalProperties":{"type":"integer"},"description":"Projected peak usage per resource."}}},"ForecastJob":{"type":"object","properties":{"defId":{"type":"string"},"label":{"type":"string"},"team":{"type":"string"},"startAt":{"type":"string","format":"date-time"},"endAt":{"type":"string","format":"date-time"},"eligible":{"type":"boolean"},"reason":{"type":"string","description":"Why it does not run (\"no calendar match\", \"blocked by deps\"...)."},"wave":{"type":"integer","description":"Topological order (0 = root)."},"wouldBreachSla":{"type":"boolean"}}},"ArchiveList":{"type":"object","properties":{"dir":{"type":"string"},"archives":{"type":"array","items":{"$ref":"#/components/schemas/ArchiveItem"}}}},"ArchiveItem":{"type":"object","properties":{"file":{"type":"string","example":"instances-2026-07-01.ndjson"},"day":{"type":"string","format":"date"},"sizeBytes":{"type":"integer"},"modifiedAt":{"type":"string","format":"date-time"}}},"Readyz":{"type":"object","properties":{"ready":{"type":"boolean"},"db":{"type":"object","properties":{"ok":{"type":"boolean"},"detail":{"type":"string"}}},"leader":{"type":"object","description":"Informational — a follower is ready.","properties":{"ok":{"type":"boolean"},"detail":{"type":"string","enum":["leader","follower"]}}},"schedulerLastTickAgeSeconds":{"type":"number"},"schedulerStale":{"type":"boolean","description":"Last tick more than 120s ago (informational, does not fail)."},"lastDaily":{"type":"string","format":"date"}}}}}}</script>

<body>
<header>
  <div class="brand">REGENTE<small>integration API</small></div>
  <div class="links"><a href="index.html">← Docs</a> · <a href="openapi.yaml">openapi.yaml</a> · <a href="openapi.json">openapi.json</a></div>
  <input id="tok" type="password" placeholder="Bearer token (only for Try it; kept in localStorage)" autocomplete="off">
  <div class="staticnote">Static reference. To send real requests, open <code>/api-docs</code> on a running Regente server.</div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p style="color:var(--muted)">Loading the contract…</p></main>
</div>
<footer>Curated contract of the integration surface (API-1) — embedded in the binary, self-contained, zero CDN.</footer>
<script>
"use strict";
let spec = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOK_KEY = "regente:apidocs:token";
const tokEl = document.getElementById("tok");
tokEl.value = localStorage.getItem(TOK_KEY) || "";
tokEl.addEventListener("input", () => localStorage.setItem(TOK_KEY, tokEl.value));

// A spec chega de dois jeitos. Servido pelo server: fetch do /api-docs/openapi.json.
// Gerado pelo docsite (site estático): o docsite INJETA a spec neste <script> — o
// fetch é bloqueado em file:// (CORS), e sem server não há Try-it pra chamar. A
// presença do node é o sinal de modo estático.
const inlineSpec = document.getElementById("openapi-inline");
const STATIC = !!inlineSpec;
if (STATIC) {
  document.body.classList.add("static");
  // queueMicrotask de propósito: render() usa bindings `let` declarados MAIS
  // ABAIXO neste script (opSeq etc.). Chamar aqui, síncrono, cai na temporal
  // dead zone — o caminho do fetch nunca viu isso por ser assíncrono.
  queueMicrotask(() => {
    try { spec = JSON.parse(inlineSpec.textContent); render(); }
    catch (e) { document.getElementById("main").innerHTML = "<p>Malformed embedded spec: " + esc(e) + "</p>"; }
  });
} else {
  fetch("openapi.json").then(r => r.json()).then(s => { spec = s; render(); })
    .catch(e => { document.getElementById("main").innerHTML = "<p>Failed to load openapi.json: " + esc(e) + "</p>"; });
}

function refName(ref){ return ref.split("/").pop(); }
function deref(node){
  if (node && node.$ref) {
    let cur = spec;
    for (const p of node.$ref.replace(/^#\//, "").split("/")) cur = cur[p];
    return cur;
  }
  return node;
}

// mini-markdown das descriptions da spec: ###, **b**, `code`, parágrafos.
function md(text){
  if (!text) return "";
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  return text.trim().split(/\n{2,}/).map(block => {
    block = block.trim();
    let head = "";
    if (block.startsWith("### ")) {
      const nl = block.indexOf("\n");
      const title = nl === -1 ? block.slice(4) : block.slice(4, nl);
      head = "<h4>" + inline(title) + "</h4>";
      block = nl === -1 ? "" : block.slice(nl + 1);
    }
    // \n solto é wrap da fonte YAML, não quebra intencional — vira espaço.
    return head + (block ? "<p>" + inline(block).replace(/\n/g, " ") + "</p>" : "");
  }).join("");
}

function typeStr(sch){
  if (!sch) return "—";
  if (sch.$ref) return refName(sch.$ref);
  if (sch.type === "array") return typeStr(sch.items) + "[]";
  let t = sch.type || (sch.oneOf ? "oneOf" : sch.allOf ? "allOf" : "object");
  if (sch.format) t += " (" + sch.format + ")";
  if (sch.enum) t += " ∈ {" + sch.enum.join(" · ") + "}";
  return t;
}

function schemaTree(sch, seen){
  seen = seen || new Set();
  if (!sch) return "";
  if (sch.$ref) {
    const name = refName(sch.$ref);
    if (seen.has(name)) return '<li><span class="t">' + esc(name) + "</span> <span class=d>(recursivo)</span></li>";
    seen = new Set(seen); seen.add(name);
    return schemaTree(deref(sch), seen);
  }
  if (sch.oneOf) return sch.oneOf.map((o,i) =>
    '<li><span class=d>forma ' + (i+1) + ": " + esc(typeStr(o)) + "</span><ul>" + schemaTree(o, seen) + "</ul></li>").join("");
  if (sch.allOf) return sch.allOf.map(o => schemaTree(o, seen)).join("");
  if (sch.type === "array") return '<li><span class=d>itens: ' + esc(typeStr(sch.items)) + "</span><ul>" + schemaTree(sch.items, seen) + "</ul></li>";
  if (sch.properties) {
    const req = new Set(sch.required || []);
    return Object.entries(sch.properties).map(([k, v]) => {
      const dv = v.$ref ? deref(v) : v;
      const kids = (dv.properties || dv.oneOf || dv.allOf || (dv.type === "array" && dv.items && (dv.items.$ref || dv.items.properties)))
        ? "<ul>" + schemaTree(v, seen) + "</ul>" : "";
      return '<li><span class=n>' + esc(k) + "</span>" + (req.has(k) ? '<span class=req>*</span>' : "") +
        ' <span class=t>' + esc(typeStr(v)) + "</span>" +
        (dv.description ? ' — <span class=d>' + esc(dv.description) + "</span>" : "") + kids + "</li>";
    }).join("");
  }
  return sch.description ? '<li><span class=d>' + esc(sch.description) + "</span></li>" : "";
}

function jsonBody(op){
  const rb = op.requestBody && op.requestBody.content && op.requestBody.content["application/json"];
  return rb || null;
}

function curl(method, path, op){
  const origin = window.location.origin;
  const pub = Array.isArray(op.security) && op.security.length === 0;
  let c = "curl -X " + method.toUpperCase() + " '" + origin + path + "'";
  if (!pub) c += " \\\n  -H 'Authorization: Bearer $REGENTE_TOKEN'";
  const rb = jsonBody(op);
  if (rb) {
    c += " \\\n  -H 'Content-Type: application/json'";
    if (rb.example !== undefined) c += " \\\n  -d '" + JSON.stringify(rb.example) + "'";
    else c += " \\\n  -d '{}'";
  }
  return c;
}

function permChip(op){
  const p = op["x-permission"];
  return p ? '<span class="perm">' + esc(p) + "</span>" : "";
}

let opSeq = 0;
function opCard(path, method, op){
  const id = "op" + (++opSeq);
  const params = (op.parameters || []).map(deref);
  const rb = jsonBody(op);
  let h = '<details class="op" id="' + id + '"><summary>' +
    '<span class="badge ' + method + '">' + method.toUpperCase() + "</span>" +
    '<span class="path">' + esc(path) + "</span>" +
    '<span class="sum">' + esc(op.summary || "") + "</span>" + permChip(op) + "</summary>";
  h += '<div class="opbody">';
  if (op.description) h += '<div class="desc">' + md(op.description) + "</div>";

  if (params.length) {
    h += "<h4>Parameters</h4><table><tr><th>name</th><th>in</th><th>type</th><th>description</th></tr>";
    for (const p of params)
      h += "<tr><td><code>" + esc(p.name) + "</code>" + (p.required ? '<span class="req">*</span>' : "") +
        "</td><td>" + esc(p.in) + "</td><td><code>" + esc(typeStr(p.schema)) + "</code></td><td>" + esc(p.description || "") + "</td></tr>";
    h += "</table>";
  }

  if (rb) {
    h += "<h4>Body (application/json)</h4>";
    h += '<div class="schema"><ul>' + schemaTree(rb.schema) + "</ul></div>";
    if (rb.example !== undefined) h += "<pre>" + esc(JSON.stringify(rb.example, null, 2)) + "</pre>";
  }

  h += "<h4>Responses</h4>";
  for (const [code, r0] of Object.entries(op.responses || {})) {
    const r = deref(r0);
    const cls = code[0] === "2" ? "c2xx" : code[0] === "5" ? "c5xx" : "c4xx";
    h += '<div class="resp"><span class="code ' + cls + '">' + esc(code) + "</span>" + esc(r.description || "");
    const ct = r.content && Object.keys(r.content)[0];
    if (ct) {
      const body = r.content[ct];
      h += ' <span class="d" style="color:var(--muted)">· ' + esc(ct) + "</span>";
      if (body.schema && (body.schema.$ref || body.schema.properties || body.schema.oneOf || body.schema.allOf || body.schema.items))
        h += '<div class="schema"><ul>' + schemaTree(body.schema) + "</ul></div>";
      if (body.example !== undefined)
        h += "<pre>" + esc(typeof body.example === "string" ? body.example : JSON.stringify(body.example, null, 2)) + "</pre>";
    }
    h += "</div>";
  }

  h += "<h4>curl</h4><pre>" + esc(curl(method, path, op)) + "</pre>";

  // Try-it — single-origin: o fetch bate direto na API desta porta. No site
  // estático não há API atrás da página, então o painel nem é montado.
  if (!STATIC) {
    h += '<div class="try"><b style="font-size:13px">Try it</b>';
    for (const p of params)
      h += '<label>' + esc(p.name) + " (" + esc(p.in) + ')</label><input data-pname="' + esc(p.name) + '" data-pin="' + esc(p.in) + '">';
    if (rb) h += "<label>JSON body</label><textarea data-body>" +
      esc(rb.example !== undefined ? JSON.stringify(rb.example, null, 2) : "{}") + "</textarea>";
    h += '<button data-method="' + method + '" data-path="' + esc(path) + '" data-public="' +
      (Array.isArray(op.security) && op.security.length === 0 ? "1" : "") + '">Send</button>' +
      '<div class="out"><div class="status"></div><pre></pre></div></div>';
  }

  h += "</div></details>";
  return h;
}

function render(){
  document.title = spec.info.title;
  const byTag = new Map();
  for (const t of spec.tags || []) byTag.set(t.name, { desc: t.description, ops: [] });
  for (const [path, methods] of Object.entries(spec.paths || {}))
    for (const [method, op] of Object.entries(methods)) {
      const tag = (op.tags && op.tags[0]) || "Other";
      if (!byTag.has(tag)) byTag.set(tag, { desc: "", ops: [] });
      byTag.get(tag).ops.push({ path, method, op });
    }

  let navH = "", mainH =
    '<div class="intro"><h1>' + esc(spec.info.title) + '</h1>' +
    '<div class="ver">v' + esc(spec.info.version) + ' · OpenAPI ' + esc(spec.openapi) + "</div>" +
    '<div class="desc">' + md(spec.info.description) + "</div></div>";

  for (const [tag, group] of byTag) {
    if (!group.ops.length) continue;
    const anchor = "tag-" + tag.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    navH += "<h3>" + esc(tag) + "</h3>";
    mainH += '<section class="tag" id="' + anchor + '"><h2>' + esc(tag) + "</h2>" +
      (group.desc ? '<p class="tagdesc">' + esc(group.desc) + "</p>" : "");
    for (const { path, method, op } of group.ops) {
      const before = opSeq + 1;
      mainH += opCard(path, method, op);
      navH += '<a href="#op' + before + '"><span class="m" style="color:var(--' + method + ')">' +
        method.toUpperCase() + '</span><span>' + esc(path.replace(/^\/api/, "")) + "</span></a>";
    }
    mainH += "</section>";
  }
  document.getElementById("nav").innerHTML = navH;
  document.getElementById("main").innerHTML = mainH;

  document.querySelectorAll(".try button").forEach(btn => btn.addEventListener("click", tryIt));
  // âncora da nav abre o card
  document.querySelectorAll("nav a").forEach(a => a.addEventListener("click", () => {
    const d = document.getElementById(a.getAttribute("href").slice(1));
    if (d) d.open = true;
  }));
}

async function tryIt(ev){
  const btn = ev.currentTarget, box = btn.closest(".try");
  const out = box.querySelector(".out"), st = box.querySelector(".status"), pre = box.querySelector("pre");
  let path = btn.dataset.path;
  const qs = new URLSearchParams();
  for (const inp of box.querySelectorAll("input[data-pname]")) {
    const v = inp.value.trim();
    if (inp.dataset.pin === "path") {
      if (!v) { st.textContent = "missing path parameter: " + inp.dataset.pname; out.style.display = "block"; pre.textContent = ""; return; }
      path = path.replace("{" + inp.dataset.pname + "}", encodeURIComponent(v));
    } else if (v) qs.set(inp.dataset.pname, v);
  }
  const url = path + (qs.toString() ? "?" + qs.toString() : "");
  const headers = {};
  if (!btn.dataset.public && tokEl.value.trim()) headers["Authorization"] = "Bearer " + tokEl.value.trim();
  const opts = { method: btn.dataset.method.toUpperCase(), headers };
  const bodyEl = box.querySelector("textarea[data-body]");
  if (bodyEl) { headers["Content-Type"] = "application/json"; opts.body = bodyEl.value; }
  st.textContent = "…"; pre.textContent = ""; out.style.display = "block";
  try {
    const resp = await fetch(url, opts);
    const text = await resp.text();
    st.textContent = "HTTP " + resp.status + " · " + (resp.headers.get("content-type") || "");
    try { pre.textContent = JSON.stringify(JSON.parse(text), null, 2); }
    catch { pre.textContent = text; }
  } catch (e) { st.textContent = "error"; pre.textContent = String(e); }
}
</script>
